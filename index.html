<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <!-- THREE.JS -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <!-- GLOBE.GL -->
  <script src="https://unpkg.com/globe.gl"></script>

  <!-- COUNTRY GEOMETRY HELPERS -->
  <script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #globe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    /* -------------------------
       SEARCH
    ------------------------- */

    #searchBox {
      position: fixed;

      top: 35px;
      left: 50%;

      transform: translateX(-50%);

      width: min(88vw, 420px);

      z-index: 100;

      display: flex;
      gap: 8px;

      padding: 8px;

      border-radius: 18px;

      background: rgba(10, 15, 25, 0.68);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      border: 1px solid rgba(255,255,255,0.18);
    }

    #countryInput {
      flex: 1;

      min-width: 0;

      border: none;
      outline: none;

      border-radius: 13px;

      padding: 12px 14px;

      font-size: 16px;

      color: white;

      background: rgba(255,255,255,0.10);
    }

    #countryInput::placeholder {
      color: rgba(255,255,255,0.6);
    }

    #searchButton {
      border: none;

      border-radius: 13px;

      padding: 0 18px;

      cursor: pointer;

      font-weight: bold;

      color: #111;

      background: white;
    }

    #countryName {
      position: fixed;

      bottom: 35px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 100;

      color: white;

      font-size: 22px;
      font-weight: 700;

      text-shadow: 0 2px 12px black;

      pointer-events: none;
    }


    /* -------------------------
       SUN
    ------------------------- */

    #sun {
      position: fixed;

      width: 250px;
      height: 250px;

      left: -120px;
      top: -100px;

      border-radius: 50%;

      pointer-events: none;

      z-index: 20;

      background:
        radial-gradient(
          circle,
          rgba(255,255,220,1) 0%,
          rgba(255,220,120,0.95) 15%,
          rgba(255,170,50,0.45) 35%,
          rgba(255,130,30,0.08) 65%,
          transparent 75%
        );

      filter: blur(3px);

      box-shadow:
        0 0 100px rgba(255,190,70,.7),
        0 0 250px rgba(255,130,30,.35);
    }


    /* -------------------------
       SUN RAYS
    ------------------------- */

    .ray {
      position: fixed;

      left: -80px;

      width: 800px;
      height: 100px;

      pointer-events: none;

      z-index: 15;

      transform-origin: left center;

      filter: blur(20px);

      mix-blend-mode: screen;

      background:
        linear-gradient(
          90deg,
          rgba(255,230,150,0.25),
          rgba(255,190,80,0.10),
          transparent
        );
    }

    #ray1 {
      top: 25px;
      transform: rotate(19deg);
    }

    #ray2 {
      top: 90px;
      transform: rotate(30deg);
    }

    #ray3 {
      top: 155px;
      transform: rotate(41deg);
    }

    #ray4 {
      top: 220px;
      transform: rotate(50deg);
      opacity: .6;
    }


    /* -------------------------
       VIGNETTE
    ------------------------- */

    #vignette {
      position: fixed;
      inset: 0;

      pointer-events: none;

      z-index: 30;

      box-shadow:
        inset 0 0 130px rgba(0,0,0,.45);
    }
  </style>
</head>


<body>

  <div id="globe"></div>

  <div id="sun"></div>

  <div id="ray1" class="ray"></div>
  <div id="ray2" class="ray"></div>
  <div id="ray3" class="ray"></div>
  <div id="ray4" class="ray"></div>

  <div id="vignette"></div>


  <!-- SEARCH -->

  <div id="searchBox">

    <input
      id="countryInput"
      type="text"
      placeholder="Search country..."
      autocomplete="off"
    >

    <button id="searchButton">
      Go
    </button>

  </div>


  <div id="countryName"></div>


<script>

/* ============================================================
   CREATE EARTH
============================================================ */

const world = Globe()(
  document.getElementById("globe")
);


/* ============================================================
   EARTH TEXTURE
============================================================ */

world

  .globeImageUrl(
    "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
  )

  .bumpImageUrl(
    "https://unpkg.com/three-globe/example/img/earth-topology.png"
  )

  .backgroundImageUrl(
    "https://unpkg.com/three-globe/example/img/night-sky.png"
  )

  .showAtmosphere(true)

  .atmosphereColor("#5aaeff")

  .atmosphereAltitude(0.18);



/* ============================================================
   START CAMERA

   SMALL ALTITUDE = HUGE EARTH

   2.0  = whole Earth
   1.0  = large Earth
   0.5  = regional
   0.25 = country
   0.12 = extremely close
============================================================ */

world.pointOfView(
  {
    lat: 39,
    lng: 30,
    altitude: 0.55
  },
  0
);



/* ============================================================
   CONTROLS
============================================================ */

const controls = world.controls();

controls.enableRotate = true;

controls.enableZoom = true;

controls.enablePan = false;

controls.enableDamping = true;

controls.dampingFactor = 0.08;


/*
VERY CLOSE zoom allowed.
Earth radius is approximately 100.
*/

controls.minDistance = 101;

controls.maxDistance = 700;


/*
Initially slowly rotate Earth.
*/

controls.autoRotate = true;

controls.autoRotateSpeed = 0.12;



/* ============================================================
   STOP AUTO ROTATION
============================================================ */

function stopRotation() {

  controls.autoRotate = false;

}

document.addEventListener(
  "pointerdown",
  stopRotation
);

document.addEventListener(
  "wheel",
  stopRotation
);



/* ============================================================
   LIGHTING
============================================================ */

const scene = world.scene();


/*
Warm sunlight coming from upper-left.
*/

const sunLight =
  new THREE.DirectionalLight(
    0xffe0a3,
    2.2
  );

sunLight.position.set(
  -300,
  200,
  250
);

scene.add(
  sunLight
);


/*
Soft ambient light so dark areas still have detail.
*/

const ambientLight =
  new THREE.AmbientLight(
    0x6688aa,
    0.45
  );

scene.add(
  ambientLight
);



/* ============================================================
   CLOUD LAYER
============================================================ */

const cloudTextureLoader =
  new THREE.TextureLoader();


cloudTextureLoader.load(

  "https://raw.githubusercontent.com/turban/webgl-earth/master/images/fair_clouds_4k.png",

  function(cloudTexture) {

    cloudTexture.colorSpace =
      THREE.SRGBColorSpace;


    /*
    Slightly larger than Earth itself.
    */

    const cloudGeometry =
      new THREE.SphereGeometry(
        100.55,
        96,
        96
      );


    const cloudMaterial =
      new THREE.MeshPhongMaterial({

        map: cloudTexture,

        transparent: true,

        opacity: 0.48,

        depthWrite: false,

        side: THREE.DoubleSide

      });


    const cloudMesh =
      new THREE.Mesh(
        cloudGeometry,
        cloudMaterial
      );


    scene.add(
      cloudMesh
    );


    /*
    Slowly move cloud layer independently.
    */

    function animateClouds() {

      cloudMesh.rotation.y += 0.00018;

      requestAnimationFrame(
        animateClouds
      );

    }

    animateClouds();

  }

);



/* ============================================================
   COUNTRIES
============================================================ */

let countries = [];

let selectedCountry = null;



fetch(
  "https://cdn.jsdelivr.net/gh/holtzy/D3-graph-gallery@master/DATA/world.geojson"
)

.then(
  response => response.json()
)

.then(
  data => {

    countries =
      data.features;


    world

      .polygonsData(
        countries
      )


      /*
      Borders sit slightly above Earth/clouds.
      */

      .polygonAltitude(
        country =>
          country === selectedCountry
            ? 0.014
            : 0.009
      )


      /*
      Normally transparent countries.
      Selected country gets a subtle gold fill.
      */

      .polygonCapColor(
        country =>
          country === selectedCountry

            ? "rgba(255,180,50,0.15)"

            : "rgba(0,0,0,0)"
      )


      .polygonSideColor(
        () =>
          "rgba(0,0,0,0)"
      )


      /*
      ALL country borders.
      */

      .polygonStrokeColor(
        country =>
          country === selectedCountry

            ? "rgba(255,205,70,1)"

            : "rgba(255,215,110,0.65)"
      )

      .polygonsTransitionDuration(
        300
      );

  }
);



/* ============================================================
   COUNTRY SEARCH NORMALIZATION
============================================================ */

function normalizeCountryName(text) {

  return text

    .toLowerCase()

    .normalize("NFD")

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .replace(
      /[^a-z0-9]/g,
      ""
    );

}



/* ============================================================
   COMMON NAME ALIASES
============================================================ */

const aliases = {

  turkiye:
    "turkey",

  turkey:
    "turkey",

  usa:
    "unitedstatesofamerica",

  us:
    "unitedstatesofamerica",

  america:
    "unitedstatesofamerica",

  unitedstates:
    "unitedstatesofamerica",

  uk:
    "unitedkingdom",

  britain:
    "unitedkingdom",

  greatbritain:
    "unitedkingdom",

  uae:
    "unitedarabemirates",

  korea:
    "southkorea",

  southkorea:
    "southkorea",

  northkorea:
    "northkorea"

};



/* ============================================================
   FIND COUNTRY
============================================================ */

function findCountry(
  searchText
) {

  let query =
    normalizeCountryName(
      searchText
    );


  if (
    aliases[query]
  ) {

    query =
      aliases[query];

  }


  /*
  First try exact match.
  */

  let result =
    countries.find(
      country =>
        normalizeCountryName(
          country.properties.name
        ) === query
    );


  if (
    result
  ) {

    return result;

  }


  /*
  Then partial match.
  */

  result =
    countries.find(
      country => {

        const name =
          normalizeCountryName(
            country.properties.name
          );


        return (

          name.includes(
            query
          )

          ||

          query.includes(
            name
          )

        );

      }
    );


  return result;

}



/* ============================================================
   CALCULATE COUNTRY CAMERA ZOOM
============================================================ */

function getCountryAltitude(
  country
) {

  const bounds =
    d3.geoBounds(
      country
    );


  let longitudeSize =
    Math.abs(
      bounds[1][0] -
      bounds[0][0]
    );


  const latitudeSize =
    Math.abs(
      bounds[1][1] -
      bounds[0][1]
    );


  /*
  Handle countries crossing longitude boundary.
  */

  if (
    longitudeSize > 180
  ) {

    longitudeSize =
      latitudeSize;

  }


  const size =
    Math.max(
      longitudeSize,
      latitudeSize
    );


  /*
  Country-size adaptive zoom.

  Tiny country:
      ≈ 0.12

  Türkiye / France:
      ≈ 0.20–0.30

  USA:
      ≈ 0.45

  Russia:
      ≈ 0.65
  */

  let altitude =
    0.10 +
    size * 0.008;


  altitude =
    Math.max(
      0.12,
      altitude
    );


  altitude =
    Math.min(
      0.68,
      altitude
    );


  return altitude;

}



/* ============================================================
   FLY TO COUNTRY
============================================================ */

function flyToCountry(
  country
) {

  if (
    !country
  ) {

    return;

  }


  selectedCountry =
    country;


  controls.autoRotate =
    false;


  /*
  Geographic center of country.
  */

  const center =
    d3.geoCentroid(
      country
    );


  const longitude =
    center[0];


  const latitude =
    center[1];


  const altitude =
    getCountryAltitude(
      country
    );


  /*
  Fly animation.
  */

  world.pointOfView(
    {

      lat:
        latitude,

      lng:
        longitude,

      altitude:
        altitude

    },

    1800
  );


  /*
  Refresh border style.
  */

  world

    .polygonAltitude(
      c =>
        c === selectedCountry
          ? 0.014
          : 0.009
    )

    .polygonCapColor(
      c =>
        c === selectedCountry
          ? "rgba(255,180,50,0.15)"
          : "rgba(0,0,0,0)"
    )

    .polygonStrokeColor(
      c =>
        c === selectedCountry
          ? "rgba(255,220,80,1)"
          : "rgba(255,215,110,0.60)"
    );


  /*
  Country label.
  */

  document.getElementById(
    "countryName"
  ).textContent =
    country.properties.name;

}



/* ============================================================
   SEARCH ACTION
============================================================ */

function searchCountry() {

  const input =
    document.getElementById(
      "countryInput"
    );


  const searchText =
    input.value.trim();


  if (
    !searchText
  ) {

    return;

  }


  const country =
    findCountry(
      searchText
    );


  if (
    country
  ) {

    flyToCountry(
      country
    );

  }

  else {

    document.getElementById(
      "countryName"
    ).textContent =
      "Country not found";

  }

}



/* ============================================================
   SEARCH BUTTON
============================================================ */

document.getElementById(
  "searchButton"
)

.addEventListener(
  "click",
  searchCountry
);



/* ============================================================
   ENTER KEY
============================================================ */

document.getElementById(
  "countryInput"
)

.addEventListener(

  "keydown",

  function(event) {

    if (
      event.key === "Enter"
    ) {

      searchCountry();

    }

  }

);



/* ============================================================
   CLICK COUNTRY DIRECTLY
============================================================ */

world.onPolygonClick(

  country => {

    flyToCountry(
      country
    );

  }

);



/* ============================================================
   RESPONSIVE
============================================================ */

function resize() {

  world

    .width(
      window.innerWidth
    )

    .height(
      window.innerHeight
    );

}


window.addEventListener(
  "resize",
  resize
);


resize();

</script>

</body>
</html>
