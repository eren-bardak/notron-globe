<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02050a;
  font-family:Arial,sans-serif;
}

#scene{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;

  background:
    radial-gradient(circle at 20% 15%,#17365c55,transparent 35%),
    linear-gradient(#06111f,#02050a);
}

/* MAP */

#map{
  position:absolute;
  width:100%;
  height:100%;
}

.country{
  fill:#14335d;
  stroke:#6fc8ff;
  stroke-width:2.5;
  filter:drop-shadow(0 0 10px #36aaff);

  animation:breathe 5s ease-in-out infinite;
}

@keyframes breathe{
  0%,100%{
    filter:drop-shadow(0 0 8px #36aaff);
  }
  50%{
    filter:drop-shadow(0 0 18px #60cfff);
  }
}


/* CLOUD */

.cloud{
  position:absolute;

  width:clamp(80px,24vw,135px);
  height:clamp(45px,13vw,72px);

  display:flex;
  align-items:center;
  justify-content:center;

  color:#223040;
  font-size:clamp(10px,3vw,14px);
  font-weight:600;
  text-align:center;

  padding:8px;

  background:
    radial-gradient(circle at 35% 35%,white 0 25%,transparent 27%),
    radial-gradient(circle at 55% 25%,white 0 32%,transparent 34%),
    radial-gradient(circle at 72% 40%,#f7fbff 0 25%,transparent 27%),
    radial-gradient(circle at 50% 65%,#eaf5ff 0 45%,transparent 47%);

  filter:
    drop-shadow(0 6px 10px #0008)
    drop-shadow(0 0 7px #b9e6ff66);

  opacity:.92;

  transform:translate(-50%,-50%);

  transition:opacity .8s ease;

  animation:floatCloud 7s ease-in-out infinite;
}

.cloud:nth-child(2){animation-delay:-1s}
.cloud:nth-child(3){animation-delay:-2s}
.cloud:nth-child(4){animation-delay:-3s}
.cloud:nth-child(5){animation-delay:-4s}
.cloud:nth-child(6){animation-delay:-5s}

@keyframes floatCloud{

  0%,100%{
    transform:
      translate(-50%,-50%)
      translate(0,0);
  }

  50%{
    transform:
      translate(-50%,-50%)
      translate(10px,-7px);
  }
}


/* SCALE */

#scale{
  position:absolute;

  right:18px;
  top:50%;

  transform:translateY(-50%);

  width:52px;
  height:310px;

  border:1px solid #239cff;
  border-radius:18px;

  background:#030a13dd;

  box-shadow:
    0 0 15px #008cff66,
    inset 0 0 15px #008cff22;
}

#track{
  position:absolute;

  right:10px;
  top:20px;

  width:5px;
  height:270px;

  border-radius:10px;

  background:#18344c;
}

#fill{
  position:absolute;

  bottom:0;
  width:100%;

  height:55%;

  border-radius:10px;

  background:#00c8ff;

  box-shadow:0 0 12px #00c8ff;
}

#knob{
  position:absolute;

  left:50%;
  top:45%;

  width:15px;
  height:15px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:#00e5ff;

  box-shadow:0 0 15px #00e5ff;

  transition:top 1.5s ease;
}

#numbers{
  position:absolute;

  left:8px;
  top:17px;
  bottom:17px;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  color:white;
  font-size:12px;
}


/* TITLE */

#title{
  position:absolute;

  left:50%;
  bottom:25px;

  transform:translateX(-50%);

  color:white;

  font-size:18px;
  letter-spacing:5px;

  text-shadow:0 0 10px #3caeff;
}

</style>
</head>


<body>

<div id="scene">

  <svg id="map"></svg>

  <div id="cloudLayer"></div>

  <div id="scale">

    <div id="numbers">
      <span>11</span>
      <span>10</span>
      <span>9</span>
      <span>8</span>
      <span>7</span>
      <span>6</span>
      <span>5</span>
      <span>4</span>
      <span>3</span>
      <span>2</span>
      <span>1</span>
      <span>0</span>
    </div>

    <div id="track">
      <div id="fill"></div>
      <div id="knob"></div>
    </div>

  </div>

  <div id="title">
    TÜRKİYE
  </div>

</div>


<script>

const comments = [
  "Katılıyorum",
  "Mantıklı",
  "Olabilir",
  "Bence evet",
  "Emin değilim",
  "Güzel fikir",
  "Kararsızım",
  "Neden olmasın?"
];

const locations = [

  [29.06,40.19],
  [32.85,39.93],
  [32.49,37.87],
  [35.48,38.73],
  [38.31,38.35],
  [37.38,37.07]

];

let projection;


/* ----------------------
   DRAW TÜRKİYE
---------------------- */

fetch(
"https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson"
)

.then(r=>r.json())

.then(data=>{

  const turkey =
    data.features.find(d =>
      d.properties.name==="Turkey"
    );

  drawTurkey(turkey);

});


function drawTurkey(turkey){

  const width=window.innerWidth;
  const height=window.innerHeight;

  const svg=d3.select("#map");

  svg
    .attr("width",width)
    .attr("height",height);

  projection =
    d3.geoMercator()
    .fitExtent(
      [
        [25,80],
        [width-75,height-80]
      ],
      turkey
    );

  const path =
    d3.geoPath(projection);

  svg.selectAll("*").remove();

  svg
    .append("path")
    .datum(turkey)
    .attr("class","country")
    .attr("d",path);

  createClouds();

}


/* ----------------------
   CLOUDS
---------------------- */

function createClouds(){

  const layer =
    document.getElementById("cloudLayer");

  layer.innerHTML="";


  locations.forEach((location,index)=>{

    const point =
      projection(location);


    const cloud =
      document.createElement("div");


    cloud.className="cloud";


    cloud.style.left =
      point[0]+"px";

    cloud.style.top =
      point[1]+"px";


    cloud.innerText =
      comments[index];


    layer.appendChild(cloud);

  });

}


/* ----------------------
   CHANGE COMMENTS
---------------------- */

setInterval(()=>{

  const clouds =
    document.querySelectorAll(".cloud");


  clouds.forEach(cloud=>{

    if(Math.random()>.45){

      cloud.style.opacity=0;


      setTimeout(()=>{

        const random =
          comments[
            Math.floor(
              Math.random()*comments.length
            )
          ];


        cloud.innerText=random;

        cloud.style.opacity=.92;

      },800);

    }

  });

},4200);



/* ----------------------
   SLIDER
---------------------- */

let level=6;

function updateSlider(){

  level =
    Math.max(
      0,
      Math.min(
        11,
        level + (Math.random()>.5 ? 1 : -1)
      )
    );


  const percentage =
    100-(level/11*100);


  document.getElementById("knob")
    .style.top =
    percentage+"%";


  document.getElementById("fill")
    .style.height =
    (level/11*100)+"%";

}


setInterval(
  updateSlider,
  3500
);


</script>

</body>
</html>
