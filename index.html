<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />

  <title>Notron Commune</title>

  <!-- CESIUM -->
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.121/Build/Cesium/Cesium.js"></script>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/cesium@1.121/Build/Cesium/Widgets/widgets.css"
  />

  <!-- TURF: geographic calculations -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>

  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    /* remove Cesium credits/buttons visually */
    .cesium-viewer-bottom,
    .cesium-viewer-toolbar {
      display: none !important;
    }

    /* ==========================
       SEARCH
    ========================== */

    #ui {
      position: fixed;

      top: 24px;
      left: 50%;

      transform: translateX(-50%);

      width: min(90vw, 440px);

      z-index: 1000;
    }

    #search {
      display: flex;

      gap: 8px;

      padding: 8px;

      border-radius: 20px;

      background: rgba(5, 11, 22, 0.75);

      backdrop-filter: blur(18px);

      border: 1px solid rgba(255,255,255,.13);

      box-shadow:
        0 15px 40px rgba(0,0,0,.35);
    }

    #countryInput {
      flex: 1;

      border: none;
      outline: none;

      padding: 13px 15px;

      border-radius: 14px;

      background: rgba(255,255,255,.08);

      color: white;

      font-size: 15px;
    }

    #countryInput::placeholder {
      color: rgba(255,255,255,.5);
    }

    #focusButton {
      border: none;

      border-radius: 14px;

      padding: 0 18px;

      background: white;

      color: #09111d;

      font-weight: 700;

      cursor: pointer;
    }

    #status {
      width: max-content;

      max-width: 90%;

      margin: 9px auto;

      padding: 7px 13px;

      border-radius: 999px;

      background: rgba(5,11,22,.65);

      backdrop-filter: blur(12px);

      border: 1px solid rgba(255,255,255,.10);

      color: rgba(255,255,255,.65);

      font-size: 11px;
    }

    #status strong {
      color: white;
    }

    /* ==========================
       CLOUD COMMENTS
    ========================== */

    #cloudLayer {
      position: fixed;

      inset: 0;

      pointer-events: none;

      z-index: 500;
    }

    .cloud {
      position: absolute;

      transform:
        translate(-50%, -50%)
        scale(.15);

      min-width: 72px;
      max-width: 110px;

      padding: 9px 13px;

      color: #152437;

      font-size: 10px;
      font-weight: 700;

      text-align: center;

      opacity: 0;

      border-radius: 999px;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.98),
          rgba(224,241,255,.94)
        );

      box-shadow:
        0 8px 22px rgba(0,0,0,.22),
        0 0 18px rgba(170,220,255,.30);

      animation:
        cloudLife 8s ease-in-out forwards,
        cloudFloat 4s ease-in-out infinite alternate;
    }

    .cloud::before {
      content: "";

      position: absolute;

      width: 32px;
      height: 32px;

      top: -13px;
      left: 17px;

      border-radius: 50%;

      background: white;

      z-index: -1;
    }

    .cloud::after {
      content: "";

      position: absolute;

      width: 38px;
      height: 38px;

      top: -16px;
      right: 15px;

      border-radius: 50%;

      background: #f8fcff;

      z-index: -1;
    }

    @keyframes cloudLife {

      0% {
        opacity: 0;

        transform:
          translate(-50%, -50%)
          translateY(10px)
          scale(.15);
      }

      15% {
        opacity: 1;

        transform:
          translate(-50%, -50%)
          translateY(0)
          scale(1);
      }

      70% {
        opacity: 1;

        transform:
          translate(-50%, -50%)
          translateY(-5px)
          scale(1);
      }

      100% {
        opacity: 0;

        transform:
          translate(-50%, -50%)
          translateY(-18px)
          scale(.85);
      }
    }

    @keyframes cloudFloat {

      from {
        margin-left: -5px;
      }

      to {
        margin-left: 7px;
      }
    }
  </style>
</head>


<body>

<div id="cesiumContainer"></div>


<div id="ui">

  <form id="search">

    <input
      id="countryInput"
      placeholder="Search country..."
      autocomplete="off"
    />

    <button
      id="focusButton"
      type="submit"
    >
      Focus
    </button>

  </form>


  <div id="status">

    <strong id="countryLabel">
      Türkiye
    </strong>

    · Commune · Anonymous reactions

  </div>

</div>


<div id="cloudLayer"></div>


<script>

/* =========================================================
   CESIUM EARTH
========================================================= */


const viewer =
  new Cesium.Viewer(
    "cesiumContainer",
    {

      animation: false,

      timeline: false,

      baseLayerPicker: false,

      geocoder: false,

      homeButton: false,

      sceneModePicker: false,

      navigationHelpButton: false,

      fullscreenButton: false,

      infoBox: false,

      selectionIndicator: false,

      shouldAnimate: true,

      terrainProvider:
        new Cesium.EllipsoidTerrainProvider(),

      baseLayer: false

    }
  );


/* =========================================================
   HIGH RESOLUTION SATELLITE TILES

   This replaces the 8K texture.

   As you zoom:
   more detailed image tiles automatically load.
========================================================= */


const satellite =
  new Cesium.UrlTemplateImageryProvider({

    url:
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

    maximumLevel:
      19,

    credit:
      "Esri World Imagery"

  });


viewer.imageryLayers.addImageryProvider(
  satellite
);


/* =========================================================
   IMAGE QUALITY
========================================================= */


viewer.resolutionScale =
  Math.min(
    window.devicePixelRatio,
    2
  );


viewer.scene.globe.maximumScreenSpaceError =
  1;


viewer.scene.globe.tileCacheSize =
  1000;


viewer.scene.fxaa =
  true;


/* atmosphere */

viewer.scene.skyAtmosphere.show =
  true;


viewer.scene.globe.enableLighting =
  true;


/* allow zoom very close */

viewer.scene.screenSpaceCameraController.minimumZoomDistance =
  5000;


viewer.scene.screenSpaceCameraController.maximumZoomDistance =
  30000000;



/* =========================================================
   COUNTRY DATA
========================================================= */


let countries = [];

let selectedCountry = null;

let selectedEntity = null;


/* =========================================================
   COMMENTS
========================================================= */


const comments = [

  "Mantıklı",

  "Katılıyorum",

  "Bence iyi",

  "Emin değilim",

  "Olabilir",

  "Neden?",

  "Kararsızım",

  "Destekliyorum",

  "Riskli olabilir",

  "Daha adil olur",

  "İyi düşünülmeli",

  "Bence hayır"

];


let cloudObjects = [];

let cloudTimer = null;



/* =========================================================
   NORMALIZE COUNTRY NAME
========================================================= */


function normalize(text){

  return String(text || "")

    .toLowerCase()

    .replaceAll(
      "ı",
      "i"
    )

    .normalize(
      "NFD"
    )

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .replace(
      /[^a-z0-9]/g,
      ""
    );

}



/* =========================================================
   LOAD COUNTRY BORDERS
========================================================= */


fetch(
  "https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson"
)

.then(
  response =>
    response.json()
)

.then(
  data => {

    countries =
      data.features;


    drawBorders();


    const turkey =
      countries.find(

        country =>

          normalize(
            country.properties.name
          )

          ===

          "turkey"

      );


    focusCountry(
      turkey,
      false
    );

  }

);



/* =========================================================
   DRAW BORDERS
========================================================= */


async function drawBorders(){


  const source =
    await Cesium.GeoJsonDataSource.load(

      {

        type:
          "FeatureCollection",

        features:
          countries

      },

      {

        stroke:
          Cesium.Color.WHITE.withAlpha(.45),

        fill:
          Cesium.Color.TRANSPARENT,

        strokeWidth:
          1.2,

        clampToGround:
          true

      }

    );


  viewer.dataSources.add(
    source
  );

}



/* =========================================================
   FIND COUNTRY
========================================================= */


function findCountry(search){


  let q =
    normalize(
      search
    );


  if(
    q === "turkiye"
  ){

    q =
      "turkey";

  }


  if(
    q === "usa"
    ||
    q === "us"
  ){

    q =
      "unitedstatesofamerica";

  }


  if(
    q === "uk"
  ){

    q =
      "unitedkingdom";

  }


  return countries.find(

    country =>

      normalize(
        country.properties.name
      )

      ===

      q

  )

  ||

  countries.find(

    country =>

      normalize(
        country.properties.name
      )

      .includes(
        q
      )

  );

}



/* =========================================================
   COUNTRY CAMERA
========================================================= */


function countryRectangle(
  country
){


  const bbox =
    turf.bbox(
      country
    );


  return Cesium.Rectangle.fromDegrees(

    bbox[0],

    bbox[1],

    bbox[2],

    bbox[3]

  );

}



/* =========================================================
   SELECT COUNTRY
========================================================= */


function focusCountry(
  country,
  animate = true
){


  if(
    !country
  )
    return;


  selectedCountry =
    country;


  document
    .getElementById(
      "countryLabel"
    )
    .innerText =

      normalize(
        country.properties.name
      )

      === "turkey"

      ?

      "Türkiye"

      :

      country.properties.name;



  clearClouds();


  const rectangle =
    countryRectangle(
      country
    );


  if(
    animate
  ){


    viewer.camera.flyTo({

      destination:
        rectangle,

      duration:
        1.7

    });

  }


  else{


    viewer.camera.setView({

      destination:
        rectangle

    });

  }


  startCloudFlow();

}



/* =========================================================
   RANDOM POINT INSIDE COUNTRY
========================================================= */


function randomPointInsideCountry(){


  if(
    !selectedCountry
  )
    return null;


  const bbox =
    turf.bbox(
      selectedCountry
    );


  for(
    let i = 0;
    i < 1000;
    i++
  ){


    const lng =

      bbox[0]

      +

      Math.random()
      *
      (
        bbox[2]
        -
        bbox[0]
      );


    const lat =

      bbox[1]

      +

      Math.random()
      *
      (
        bbox[3]
        -
        bbox[1]
      );


    const point =
      turf.point(
        [
          lng,
          lat
        ]
      );


    if(
      turf.booleanPointInPolygon(
        point,
        selectedCountry
      )
    ){


      return {

        lat,
        lng

      };

    }

  }


  return null;

}



/* =========================================================
   CLOUD
========================================================= */


function spawnCloud(){


  if(
    !selectedCountry
  )
    return;


  const point =
    randomPointInsideCountry();


  if(
    !point
  )
    return;


  const element =
    document.createElement(
      "div"
    );


  element.className =
    "cloud";


  element.innerText =

    comments[

      Math.floor(

        Math.random()

        *

        comments.length

      )

    ];


  document
    .getElementById(
      "cloudLayer"
    )
    .appendChild(
      element
    );


  const cloud = {

    element,

    lat:
      point.lat,

    lng:
      point.lng,

    position:

      Cesium.Cartesian3.fromDegrees(

        point.lng,

        point.lat,

        7000

      )

  };


  cloudObjects.push(
    cloud
  );


  if(
    cloudObjects.length > 3
  ){


    const old =
      cloudObjects.shift();


    old.element.remove();

  }



  /* remove after animation */


  setTimeout(
    ()=>{


      cloudObjects =
        cloudObjects.filter(

          item =>
            item !== cloud

        );


      element.remove();

    },

    8000

  );

}



/* =========================================================
   MOVE HTML CLOUD WITH EARTH
========================================================= */


viewer.scene.postRender.addEventListener(

  ()=>{


    cloudObjects.forEach(

      cloud =>{


        const windowPosition =

          Cesium.SceneTransforms
          .wgs84ToWindowCoordinates(

            viewer.scene,

            cloud.position

          );


        if(
          !windowPosition
        ){

          cloud.element.style.display =
            "none";

          return;

        }


        cloud.element.style.display =
          "block";


        cloud.element.style.left =
          windowPosition.x + "px";


        cloud.element.style.top =
          windowPosition.y + "px";

      }

    );

  }

);



/* =========================================================
   CLOUD FLOW
========================================================= */


function scheduleCloud(){


  const wait =

    1800

    +

    Math.random()
    *
    3200;


  cloudTimer =
    setTimeout(

      ()=>{


        spawnCloud();

        scheduleCloud();

      },

      wait

    );

}



function startCloudFlow(){


  clearTimeout(
    cloudTimer
  );


  spawnCloud();


  scheduleCloud();

}



function clearClouds(){


  clearTimeout(
    cloudTimer
  );


  cloudObjects.forEach(

    cloud =>
      cloud.element.remove()

  );


  cloudObjects = [];

}



/* =========================================================
   SEARCH
========================================================= */


document

  .getElementById(
    "search"
  )

  .addEventListener(

    "submit",

    event =>{


      event.preventDefault();


      const search =

        document

          .getElementById(
            "countryInput"
          )

          .value;


      const country =
        findCountry(
          search
        );


      if(
        country
      ){


        focusCountry(
          country
        );


        document
          .getElementById(
            "countryInput"
          )
          .blur();

      }

    }

  );

</script>

</body>
</html>
