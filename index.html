<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
/>

<title>Notron Commune</title>


<!-- CESIUM -->
<script src="https://cdn.jsdelivr.net/npm/cesium@1.121/Build/Cesium/Cesium.js"></script>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/cesium@1.121/Build/Cesium/Widgets/widgets.css"
/>


<!-- TURF -->
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>


<style>

* {
  box-sizing: border-box;
}

html,
body,
#cesiumContainer {

  width: 100%;
  height: 100%;

  margin: 0;
  padding: 0;

  overflow: hidden;

  background: black;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}


/* =========================================================
   CESIUM UI
========================================================= */

.cesium-viewer-toolbar {
  display: none !important;
}


/* =========================================================
   SEARCH
========================================================= */

#ui {

  position: fixed;

  top: 24px;
  left: 50%;

  transform: translateX(-50%);

  width: min(90vw, 440px);

  z-index: 1000;
}


#search {

  display: flex;

  gap: 8px;

  padding: 8px;

  border-radius: 20px;

  background:
    rgba(5,11,22,.76);

  border:
    1px solid rgba(255,255,255,.13);

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  box-shadow:
    0 15px 40px rgba(0,0,0,.35);
}


#countryInput {

  flex: 1;

  min-width: 0;

  border: none;
  outline: none;

  padding:
    13px 15px;

  border-radius:
    14px;

  background:
    rgba(255,255,255,.08);

  color:
    white;

  font-size:
    15px;
}


#countryInput::placeholder {

  color:
    rgba(255,255,255,.5);
}


#focusButton {

  border:
    none;

  border-radius:
    14px;

  padding:
    0 18px;

  background:
    white;

  color:
    #09111d;

  font-weight:
    700;

  cursor:
    pointer;
}


/* =========================================================
   STATUS
========================================================= */

#status {

  width:
    max-content;

  max-width:
    90%;

  margin:
    9px auto 0;

  padding:
    7px 13px;

  border-radius:
    999px;

  background:
    rgba(5,11,22,.65);

  border:
    1px solid rgba(255,255,255,.10);

  backdrop-filter:
    blur(12px);

  color:
    rgba(255,255,255,.65);

  font-size:
    11px;
}


#status strong {

  color:
    white;
}


/* =========================================================
   CLOUD LAYER
========================================================= */

#cloudLayer {

  position:
    fixed;

  inset:
    0;

  z-index:
    500;

  pointer-events:
    none;

  overflow:
    hidden;
}


/* =========================================================
   REALISTIC CLOUD
========================================================= */

.cloud {

  position:
    absolute;

  width:
    105px;

  min-height:
    44px;

  padding:
    13px 15px 11px;

  transform:
    translate(-50%,-50%)
    scale(.25);

  opacity:
    0;

  border-radius:
    50px;


  /*
  Main cloud body.
  */

  background:

    radial-gradient(
      ellipse at 22% 55%,
      rgba(255,255,255,.98) 0%,
      rgba(255,255,255,.98) 28%,
      transparent 30%
    ),

    radial-gradient(
      ellipse at 42% 32%,
      rgba(255,255,255,1) 0%,
      rgba(255,255,255,1) 35%,
      transparent 37%
    ),

    radial-gradient(
      ellipse at 63% 25%,
      rgba(255,255,255,.99) 0%,
      rgba(255,255,255,.99) 37%,
      transparent 39%
    ),

    radial-gradient(
      ellipse at 80% 56%,
      rgba(248,251,255,.98) 0%,
      rgba(248,251,255,.98) 29%,
      transparent 31%
    ),

    linear-gradient(
      180deg,
      rgba(255,255,255,.99) 0%,
      rgba(245,248,252,.98) 60%,
      rgba(220,230,240,.96) 100%
    );


  box-shadow:

    0 5px 8px
    rgba(255,255,255,.25),

    0 12px 20px
    rgba(0,0,0,.20),

    inset 0 -8px 14px
    rgba(180,195,210,.28),

    inset 0 7px 12px
    rgba(255,255,255,.90);


  filter:
    drop-shadow(
      0 5px 6px
      rgba(0,0,0,.14)
    );


  animation:

    cloudLife
    9s
    ease-in-out
    forwards,

    cloudDrift
    5.5s
    ease-in-out
    infinite
    alternate;
}


/*
Extra cloud puff — left.
*/

.cloud::before {

  content:
    "";

  position:
    absolute;

  width:
    47px;

  height:
    47px;

  left:
    13px;

  top:
    -19px;

  border-radius:
    50%;

  z-index:
    -1;


  background:

    radial-gradient(
      circle at 40% 35%,
      #fff 0%,
      #fff 45%,
      #edf3f8 75%,
      #dce5ec 100%
    );


  box-shadow:

    inset 4px 5px 8px
    rgba(255,255,255,.8),

    inset -3px -5px 8px
    rgba(185,200,214,.22);
}


/*
Extra cloud puff — right.
*/

.cloud::after {

  content:
    "";

  position:
    absolute;

  width:
    56px;

  height:
    56px;

  right:
    10px;

  top:
    -26px;

  border-radius:
    50%;

  z-index:
    -1;


  background:

    radial-gradient(
      circle at 40% 32%,
      #fff 0%,
      #fff 44%,
      #f1f5f9 74%,
      #dce5ec 100%
    );


  box-shadow:

    inset 5px 6px 10px
    rgba(255,255,255,.85),

    inset -4px -5px 8px
    rgba(185,200,214,.20);
}


/* =========================================================
   NOTE INSIDE CLOUD
========================================================= */

.cloud-text {

  position:
    relative;

  z-index:
    5;

  display:
    block;

  width:
    100%;

  text-align:
    center;

  color:
    #273545;

  font-size:
    10px;

  line-height:
    1.1;

  font-weight:
    700;

  text-shadow:
    0 1px 0
    rgba(255,255,255,.9);
}


/* =========================================================
   CLOUD APPEAR / DISAPPEAR
========================================================= */

@keyframes cloudLife {

  0% {

    opacity:
      0;

    transform:

      translate(-50%,-50%)

      translateY(14px)

      scale(.20);

    filter:
      blur(5px);
  }


  15% {

    opacity:
      1;

    transform:

      translate(-50%,-50%)

      translateY(0)

      scale(1);

    filter:
      blur(0);
  }


  65% {

    opacity:
      1;

    transform:

      translate(-50%,-50%)

      translateY(-4px)

      scale(1);
  }


  85% {

    opacity:
      .80;
  }


  100% {

    opacity:
      0;

    transform:

      translate(-50%,-50%)

      translateY(-22px)

      scale(.82);

    filter:
      blur(3px);
  }
}


@keyframes cloudDrift {

  0% {

    margin-left:
      -5px;

    margin-top:
      2px;
  }


  50% {

    margin-left:
      2px;

    margin-top:
      -4px;
  }


  100% {

    margin-left:
      7px;

    margin-top:
      1px;
  }
}


/* =========================================================
   SUN LAYER
========================================================= */

#sunLayer {

  position:
    fixed;

  inset:
    0;

  z-index:
    25;

  pointer-events:
    none;

  overflow:
    hidden;
}


#realSun {

  position:
    absolute;

  width:
    105px;

  height:
    105px;

  margin-left:
    -52px;

  margin-top:
    -52px;

  border-radius:
    50%;

  opacity:
    0;

  mix-blend-mode:
    screen;


  background:

    radial-gradient(

      circle,

      rgba(255,255,250,1) 0%,

      rgba(255,248,210,.98) 8%,

      rgba(255,220,130,.88) 18%,

      rgba(255,180,70,.48) 32%,

      rgba(255,135,30,.15) 50%,

      transparent 72%

    );


  box-shadow:

    0 0 35px
    rgba(255,245,190,.95),

    0 0 80px
    rgba(255,210,110,.65),

    0 0 170px
    rgba(255,170,55,.35),

    0 0 280px
    rgba(255,130,30,.15);
}


/* =========================================================
   SUN RAYS
========================================================= */

.realSunRay {

  position:
    absolute;

  left:
    0;

  top:
    0;

  width:
    max(135vw, 1500px);

  height:
    95px;

  opacity:
    0;

  transform-origin:
    0 50%;

  pointer-events:
    none;

  filter:
    blur(24px);

  mix-blend-mode:
    screen;


  background:

    linear-gradient(

      90deg,

      rgba(255,247,205,.36) 0%,

      rgba(255,226,150,.22) 12%,

      rgba(255,199,105,.13) 32%,

      rgba(255,175,70,.05) 55%,

      transparent 78%

    );
}


.realSunRay.soft {

  height:
    170px;

  filter:
    blur(44px);
}


#sunBloom {

  position:
    absolute;

  width:
    430px;

  height:
    430px;

  margin-left:
    -215px;

  margin-top:
    -215px;

  border-radius:
    50%;

  opacity:
    0;

  mix-blend-mode:
    screen;

  background:

    radial-gradient(

      circle,

      rgba(255,225,150,.10),

      rgba(255,185,90,.045) 35%,

      transparent 70%

    );


  filter:
    blur(20px);
}


/* =========================================================
   VIGNETTE
========================================================= */

#vignette {

  position:
    fixed;

  inset:
    0;

  pointer-events:
    none;

  z-index:
    30;

  box-shadow:

    inset 0 0 90px
    rgba(0,0,0,.15);
}


/* =========================================================
   ERROR
========================================================= */

#errorPanel {

  display:
    none;

  position:
    fixed;

  left:
    50%;

  bottom:
    35px;

  transform:
    translateX(-50%);

  z-index:
    2000;

  max-width:
    90%;

  padding:
    12px 18px;

  border-radius:
    12px;

  background:
    rgba(130,20,20,.92);

  color:
    white;

  font-size:
    12px;
}

</style>

</head>


<body>


<div id="cesiumContainer"></div>


<!-- SUN -->

<div id="sunLayer">

  <div id="sunBloom"></div>

  <div
    class="realSunRay"
    data-offset="-4">
  </div>

  <div
    class="realSunRay soft"
    data-offset="-1.5">
  </div>

  <div
    class="realSunRay"
    data-offset="2">
  </div>

  <div
    class="realSunRay soft"
    data-offset="5">
  </div>

  <div id="realSun"></div>

</div>


<div id="vignette"></div>


<!-- UI -->

<div id="ui">

<form id="search">

<input
  id="countryInput"
  placeholder="Search country..."
  autocomplete="off"
/>

<button
  id="focusButton"
  type="submit">

Focus

</button>

</form>


<div id="status">

<strong id="countryLabel">
Türkiye
</strong>

· Commune · Anonymous reactions

</div>

</div>


<div id="cloudLayer"></div>

<div id="errorPanel"></div>


<script>


/* =========================================================
   SETTINGS
========================================================= */


/*
Close zoom limit.

120000 = 120 km.
*/

const MIN_ZOOM_DISTANCE =
  120000;


/*
0 = normal dark night
1 = maximum lift

Recommended:
0.55 - 0.75
*/

const NIGHT_VISIBILITY =
  0.65;


/*
Sun ray strength.
*/

const SUN_VARIANCE_WEIGHT =
  1.0;


/*
Cloud limit.
*/

const MAX_CLOUDS =
  3;



/* =========================================================
   CESIUM VIEWER
========================================================= */


const viewer =

  new Cesium.Viewer(

    "cesiumContainer",

    {

      animation:
        false,

      timeline:
        false,

      baseLayerPicker:
        false,

      geocoder:
        false,

      homeButton:
        false,

      sceneModePicker:
        false,

      navigationHelpButton:
        false,

      fullscreenButton:
        false,

      infoBox:
        false,

      selectionIndicator:
        false,

      shouldAnimate:
        true,

      baseLayer:
        false,

      terrainProvider:

        new Cesium
          .EllipsoidTerrainProvider()

    }

  );



/* =========================================================
   QUALITY
========================================================= */


viewer.resolutionScale =

  Math.min(

    window.devicePixelRatio
    ||
    1,

    2

  );


viewer.scene.globe.maximumScreenSpaceError =
  1;


viewer.scene.globe.tileCacheSize =
  1000;


viewer.scene.globe.preloadAncestors =
  true;


viewer.scene.globe.preloadSiblings =
  true;


viewer.scene.fxaa =
  true;


/*
Keeps our border entities visible
above the imagery.
*/

viewer.scene.globe.depthTestAgainstTerrain =
  false;



/* =========================================================
   SPACE / STARS
========================================================= */


viewer.scene.skyBox.show =
  true;


viewer.scene.backgroundColor =
  Cesium.Color.BLACK;


viewer.scene.skyAtmosphere.show =
  true;


viewer.scene.sun.show =
  true;


viewer.scene.moon.show =
  true;


viewer.scene.globe.showGroundAtmosphere =
  true;



/* =========================================================
   REAL SUN LIGHTING
========================================================= */


viewer.scene.globe.enableLighting =
  true;


viewer.scene.globe.dynamicAtmosphereLighting =
  true;


viewer.scene.globe.dynamicAtmosphereLightingFromSun =
  true;


viewer.scene.light =

  new Cesium.SunLight({

    intensity:
      1.45

  });


/*
This lets lighting fade slightly
instead of making close Earth
unnecessarily black.
*/

viewer.scene.globe.lightingFadeOutDistance =
  2500000;


viewer.scene.globe.lightingFadeInDistance =
  10000000;



/* =========================================================
   REAL CURRENT TIME
========================================================= */


viewer.clock.currentTime =

  Cesium.JulianDate.fromDate(

    new Date()

  );


viewer.clock.shouldAnimate =
  true;


viewer.clock.multiplier =
  1;



/* =========================================================
   ZOOM LIMITS
========================================================= */


viewer
.scene
.screenSpaceCameraController
.minimumZoomDistance =
  MIN_ZOOM_DISTANCE;


viewer
.scene
.screenSpaceCameraController
.maximumZoomDistance =
  55000000;



/* =========================================================
   VARIABLES
========================================================= */


let countries =
  [];


let selectedCountry =
  null;


let selectedSafeArea =
  null;


let worldBorderEntities =
  [];


let selectedBorderEntities =
  [];


let cloudObjects =
  [];


let cloudTimer =
  null;



/* =========================================================
   COMMENTS
========================================================= */


const comments = [

  "Mantıklı",

  "Katılıyorum",

  "Bence iyi",

  "Emin değilim",

  "Olabilir",

  "Neden?",

  "Kararsızım",

  "Destekliyorum",

  "Riskli olabilir",

  "Daha adil olur",

  "İyi düşünülmeli",

  "Bence hayır"

];



/* =========================================================
   HELPERS
========================================================= */


function clamp(
  value,
  min,
  max
) {

  return Math.max(

    min,

    Math.min(
      max,
      value
    )

  );

}



function smoothstep(
  min,
  max,
  value
) {

  if(
    min === max
  ) {

    return 0;

  }


  const x =

    clamp(

      (value - min)
      /
      (max - min),

      0,

      1

    );


  return

    x
    *
    x
    *
    (
      3
      -
      2 * x
    );

}



function normalize(text) {

  return String(
    text || ""
  )

  .toLowerCase()

  .replaceAll(
    "ı",
    "i"
  )

  .normalize(
    "NFD"
  )

  .replace(
    /[\u0300-\u036f]/g,
    ""
  )

  .replace(
    /[^a-z0-9]/g,
    ""
  );

}



function countryName(
  country
) {

  return (

    country
      ?.properties
      ?.name

    ||

    country
      ?.properties
      ?.NAME

    ||

    country
      ?.properties
      ?.ADMIN

    ||

    ""

  );

}



function showError(
  error
) {

  console.error(
    error
  );


  const panel =

    document
      .getElementById(
        "errorPanel"
      );


  panel.style.display =
    "block";


  panel.textContent =

    "Error: "

    +

    (
      error?.message
      ||
      String(error)
    );

}



/* =========================================================
   HD SATELLITE
========================================================= */


async function loadSatelliteImagery() {


  const provider =

    await Cesium
      .ArcGisMapServerImageryProvider
      .fromUrl(

        "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"

      );


  const layer =

    viewer
      .imageryLayers
      .addImageryProvider(
        provider
      );


  /*
  Slightly lift satellite shadows.
  */

  layer.brightness =
    1.10;


  layer.contrast =
    0.95;


  layer.gamma =
    1.08;

}



/* =========================================================
   FIND COUNTRY
========================================================= */


function findCountry(
  search
) {


  let query =

    normalize(
      search
    );


  if(
    query === "turkiye"
  ) {

    query =
      "turkey";

  }


  if(
    query === "usa"
    ||
    query === "us"
  ) {

    query =
      "unitedstatesofamerica";

  }


  if(
    query === "uk"
  ) {

    query =
      "unitedkingdom";

  }


  return countries.find(

    country =>

      normalize(
        countryName(
          country
        )
      )

      ===

      query

  )

  ||

  countries.find(

    country =>

      normalize(
        countryName(
          country
        )
      )
      .includes(
        query
      )

  );

}



/* =========================================================
   COUNTRY RINGS
========================================================= */


function getCountryRings(
  feature
) {


  const geometry =
    feature?.geometry;


  if(
    !geometry
  ) {

    return [];

  }


  if(
    geometry.type === "Polygon"
  ) {

    return [

      geometry.coordinates[0]

    ];

  }


  if(
    geometry.type === "MultiPolygon"
  ) {

    return geometry
      .coordinates
      .map(

        polygon =>
          polygon[0]

      );

  }


  return [];

}



/* =========================================================
   RING TO CESIUM POSITIONS
========================================================= */


function ringToPositions(
  ring
) {


  const degrees =
    [];


  ring.forEach(

    coordinate => {


      degrees.push(

        coordinate[0],

        coordinate[1]

      );

    }

  );


  return Cesium
    .Cartesian3
    .fromDegreesArray(
      degrees
    );

}



/* =========================================================
   REMOVE ENTITY GROUP
========================================================= */


function clearEntityList(
  list
) {


  list.forEach(

    entity => {

      viewer
        .entities
        .remove(
          entity
        );

    }

  );


  list.length =
    0;

}



/* =========================================================
   ALL COUNTRY BORDERS

   NO BLACK BORDER.
   WHITE ONLY.
========================================================= */


function drawWorldBorders() {


  clearEntityList(
    worldBorderEntities
  );


  countries.forEach(

    country => {


      getCountryRings(
        country
      )

      .forEach(

        ring => {


          const positions =

            ringToPositions(
              ring
            );


          /*
          Soft white under-layer.

          Still WHITE.
          Not black.
          */


          const softLine =

            viewer
              .entities
              .add({

                polyline: {

                  positions:
                    positions,

                  width:
                    2.1,

                  material:

                    Cesium
                      .Color
                      .WHITE
                      .withAlpha(
                        .30
                      ),

                  clampToGround:
                    true,

                  arcType:
                    Cesium
                      .ArcType
                      .GEODESIC

                }

              });



          /*
          Main country border.
          */


          const line =

            viewer
              .entities
              .add({

                polyline: {

                  positions:
                    positions,

                  width:
                    1.15,

                  material:

                    Cesium
                      .Color
                      .WHITE
                      .withAlpha(
                        .92
                      ),

                  clampToGround:
                    true,

                  arcType:
                    Cesium
                      .ArcType
                      .GEODESIC

                }

              });



          worldBorderEntities.push(

            softLine,

            line

          );

        }

      );

    }

  );

}



/* =========================================================
   SELECTED COUNTRY BORDER

   WHITE ONLY.
   Slightly thicker than others.
========================================================= */


function highlightCountry(
  country
) {


  clearEntityList(
    selectedBorderEntities
  );


  getCountryRings(
    country
  )

  .forEach(

    ring => {


      const positions =

        ringToPositions(
          ring
        );


      /*
      Soft white glow.
      */


      const softLine =

        viewer
          .entities
          .add({

            polyline: {

              positions:
                positions,

              width:
                3.2,

              material:

                Cesium
                  .Color
                  .WHITE
                  .withAlpha(
                    .30
                  ),

              clampToGround:
                true,

              arcType:
                Cesium
                  .ArcType
                  .GEODESIC

            }

          });



      /*
      Main selected border.
      */


      const line =

        viewer
          .entities
          .add({

            polyline: {

              positions:
                positions,

              width:
                1.8,

              material:

                Cesium
                  .Color
                  .WHITE
                  .withAlpha(
                    1
                  ),

              clampToGround:
                true,

              arcType:
                Cesium
                  .ArcType
                  .GEODESIC

            }

          });



      selectedBorderEntities.push(

        softLine,

        line

      );

    }

  );

}



/* =========================================================
   CAMERA RECTANGLE
========================================================= */


function countryRectangle(
  country
) {


  const bbox =

    turf.bbox(
      country
    );


  return Cesium
    .Rectangle
    .fromDegrees(

      bbox[0],

      bbox[1],

      bbox[2],

      bbox[3]

    );

}



/* =========================================================
   SAFE AREA FOR CLOUDS
========================================================= */


function createSafeArea(
  country
) {


  const areaKm2 =

    turf.area(
      country
    )

    /

    1000000;


  let distances;


  if(
    areaKm2 > 500000
  ) {

    distances = [

      -70,
      -55,
      -40,
      -25,
      -15

    ];

  }

  else if(
    areaKm2 > 100000
  ) {

    distances = [

      -40,
      -30,
      -20,
      -12,
      -6

    ];

  }

  else {

    distances = [

      -15,
      -10,
      -6,
      -3

    ];

  }



  for(
    const distance
    of distances
  ) {


    try {


      const safe =

        turf.buffer(

          country,

          distance,

          {

            units:
              "kilometers"

          }

        );


      if(
        safe
      ) {

        return safe;

      }

    }

    catch(error) {}

  }


  return country;

}



/* =========================================================
   FOCUS COUNTRY
========================================================= */


function focusCountry(

  country,

  animate = true

) {


  if(
    !country
  ) {

    return;

  }


  selectedCountry =
    country;


  selectedSafeArea =

    createSafeArea(
      country
    );


  const name =

    countryName(
      country
    );


  document
    .getElementById(
      "countryLabel"
    )
    .textContent =

      normalize(name)
      ===
      "turkey"

      ?

      "Türkiye"

      :

      name;


  clearClouds();


  highlightCountry(
    country
  );


  viewer
    .camera
    .flyTo({

      destination:

        countryRectangle(
          country
        ),

      duration:

        animate
        ?
        1.7
        :
        0

    });


  setTimeout(

    startCloudFlow,

    animate
    ?
    1500
    :
    450

  );

}



/* =========================================================
   RANDOM POINT INSIDE COUNTRY
========================================================= */


function randomPointInsideCountry() {


  if(
    !selectedSafeArea
  ) {

    return null;

  }


  const bbox =

    turf.bbox(
      selectedSafeArea
    );


  for(

    let attempt = 0;

    attempt < 2500;

    attempt++

  ) {


    const lng =

      bbox[0]

      +

      Math.random()

      *

      (
        bbox[2]
        -
        bbox[0]
      );


    const lat =

      bbox[1]

      +

      Math.random()

      *

      (
        bbox[3]
        -
        bbox[1]
      );


    const point =

      turf.point(

        [
          lng,
          lat
        ]

      );


    try {


      if(

        turf
          .booleanPointInPolygon(

            point,

            selectedSafeArea

          )

      ) {


        return {

          lat:
            lat,

          lng:
            lng

        };

      }

    }

    catch(error) {}

  }


  return null;

}



/* =========================================================
   CREATE REAL CLOUD
========================================================= */


function spawnCloud() {


  if(
    !selectedCountry
  ) {

    return;

  }


  const location =

    randomPointInsideCountry();


  if(
    !location
  ) {

    return;

  }


  const element =

    document
      .createElement(
        "div"
      );


  element.className =
    "cloud";


  /*
  Comment note INSIDE cloud.
  */


  const text =

    document
      .createElement(
        "span"
      );


  text.className =
    "cloud-text";


  text.textContent =

    comments[

      Math.floor(

        Math.random()

        *

        comments.length

      )

    ];


  element.appendChild(
    text
  );


  document
    .getElementById(
      "cloudLayer"
    )
    .appendChild(
      element
    );


  const cloud = {

    id:

      Date.now()

      +

      Math.random(),

    element:

      element,

    position:

      Cesium
        .Cartesian3
        .fromDegrees(

          location.lng,

          location.lat,

          7000

        )

  };


  cloudObjects.push(
    cloud
  );


  /*
  Maximum 3 clouds.
  */


  if(
    cloudObjects.length
    >
    MAX_CLOUDS
  ) {


    const oldest =

      cloudObjects.shift();


    oldest
      .element
      .remove();

  }


  /*
  Remove after animation.
  */


  setTimeout(

    ()=> {


      cloudObjects =

        cloudObjects.filter(

          item =>
            item !== cloud

        );


      element.remove();

    },

    9000

  );

}



/* =========================================================
   CLOUD FLOW
========================================================= */


function scheduleNextCloud() {


  cloudTimer =

    setTimeout(

      ()=> {


        spawnCloud();


        scheduleNextCloud();

      },

      2400

      +

      Math.random()
      *
      3200

    );

}



function startCloudFlow() {


  clearTimeout(
    cloudTimer
  );


  spawnCloud();


  cloudTimer =

    setTimeout(

      ()=> {


        spawnCloud();


        scheduleNextCloud();

      },

      2500

    );

}



function clearClouds() {


  clearTimeout(
    cloudTimer
  );


  cloudObjects.forEach(

    cloud => {

      cloud
        .element
        .remove();

    }

  );


  cloudObjects =
    [];

}



/* =========================================================
   CLOUD POSITION ON SCREEN
========================================================= */


function updateCloudPositions() {


  cloudObjects.forEach(

    cloud => {


      const position =

        Cesium
          .SceneTransforms
          .worldToWindowCoordinates(

            viewer.scene,

            cloud.position

          );


      if(
        !position
      ) {


        cloud
          .element
          .style
          .display =
            "none";


        return;

      }


      cloud
        .element
        .style
        .display =
          "block";


      cloud
        .element
        .style
        .left =

          position.x

          +

          "px";


      cloud
        .element
        .style
        .top =

          position.y

          +

          "px";

    }

  );

}



/* =========================================================
   REAL SUN CALCULATION
========================================================= */


const sunInertial =
  new Cesium.Cartesian3();


const sunFixed =
  new Cesium.Cartesian3();


const sunDirection =
  new Cesium.Cartesian3();


const sunProxy =
  new Cesium.Cartesian3();


const icrfMatrix =
  new Cesium.Matrix3();


const cameraRadial =
  new Cesium.Cartesian3();


const directionToSun =
  new Cesium.Cartesian3();


const screenScratch =
  new Cesium.Cartesian2();



/* =========================================================
   SIMPLE FALLBACK SUN POSITION
========================================================= */


function approximateSunDirection(
  date
) {


  const jd =

    date.getTime()

    /

    86400000

    +

    2440587.5;


  const n =
    jd - 2451545.0;


  let L =

    (
      280.460
      +
      0.9856474
      *
      n
    )

    %
    360;


  let g =

    (
      357.528
      +
      0.9856003
      *
      n
    )

    %
    360;


  L =
    (L + 360) % 360;


  g =
    (g + 360) % 360;


  const gRad =

    Cesium.Math.toRadians(
      g
    );


  const lambda =

    Cesium.Math.toRadians(

      L

      +

      1.915
      *
      Math.sin(
        gRad
      )

      +

      .020
      *
      Math.sin(
        2 * gRad
      )

    );


  const epsilon =

    Cesium.Math.toRadians(

      23.439

      -

      .0000004
      *
      n

    );


  const rightAscension =

    Math.atan2(

      Math.cos(
        epsilon
      )
      *
      Math.sin(
        lambda
      ),

      Math.cos(
        lambda
      )

    );


  const declination =

    Math.asin(

      Math.sin(
        epsilon
      )

      *

      Math.sin(
        lambda
      )

    );


  let gmst =

    (
      280.46061837

      +

      360.98564736629

      *

      (
        jd
        -
        2451545.0
      )
    )

    %
    360;


  gmst =
    (gmst + 360) % 360;


  let longitude =

    (
      (
        Cesium.Math.toDegrees(
          rightAscension
        )

        -

        gmst

        +

        540
      )

      %
      360
    )

    -

    180;


  longitude =

    Cesium.Math.toRadians(
      longitude
    );


  sunDirection.x =

    Math.cos(
      declination
    )

    *

    Math.cos(
      longitude
    );


  sunDirection.y =

    Math.cos(
      declination
    )

    *

    Math.sin(
      longitude
    );


  sunDirection.z =

    Math.sin(
      declination
    );


  return Cesium.Cartesian3.normalize(

    sunDirection,

    sunDirection

  );

}



/* =========================================================
   GET REAL SUN DIRECTION
========================================================= */


function getRealSunDirection() {


  const time =

    viewer
      .clock
      .currentTime;


  try {


    Cesium
      .Simon1994PlanetaryPositions
      .computeSunPositionInEarthInertialFrame(

        time,

        sunInertial

      );


    const transform =

      Cesium
        .Transforms
        .computeIcrfToFixedMatrix(

          time,

          icrfMatrix

        );


    if(
      Cesium.defined(
        transform
      )
    ) {


      Cesium
        .Matrix3
        .multiplyByVector(

          transform,

          sunInertial,

          sunFixed

        );


      Cesium
        .Cartesian3
        .normalize(

          sunFixed,

          sunDirection

        );


      return sunDirection;

    }

  }

  catch(error) {}


  return approximateSunDirection(

    new Date()

  );

}



/* =========================================================
   SUN ELEMENTS
========================================================= */


const realSun =

  document.getElementById(
    "realSun"
  );


const sunBloom =

  document.getElementById(
    "sunBloom"
  );


const sunRays =

  Array.from(

    document
      .querySelectorAll(
        ".realSunRay"
      )

  );



/* =========================================================
   UPDATE SUN RAYS
========================================================= */


function updateSunVisuals() {


  const direction =

    getRealSunDirection();


  Cesium.Cartesian3.multiplyByScalar(

    direction,

    65000000,

    sunProxy

  );


  const cameraHeight =

    viewer
      .camera
      .positionCartographic
      .height;


  /*
  Rays appear mostly in globe / space view.
  */


  const zoomContribution =

    smoothstep(

      1600000,

      6500000,

      cameraHeight

    );


  Cesium.Cartesian3.normalize(

    viewer.camera.positionWC,

    cameraRadial

  );


  const hemisphereContribution =

    smoothstep(

      -.35,

      .15,

      Cesium.Cartesian3.dot(

        cameraRadial,

        direction

      )

    );


  Cesium.Cartesian3.subtract(

    sunProxy,

    viewer.camera.positionWC,

    directionToSun

  );


  Cesium.Cartesian3.normalize(

    directionToSun,

    directionToSun

  );


  const facingContribution =

    smoothstep(

      -.85,

      .10,

      Cesium.Cartesian3.dot(

        viewer.camera.directionWC,

        directionToSun

      )

    );


  const contribution =

    clamp(

      zoomContribution

      *

      hemisphereContribution

      *

      facingContribution

      *

      SUN_VARIANCE_WEIGHT,

      0,

      1

    );


  const screen =

    Cesium
      .SceneTransforms
      .worldToWindowCoordinates(

        viewer.scene,

        sunProxy,

        screenScratch

      );


  if(
    !screen
    ||
    contribution < .01
  ) {


    realSun.style.opacity =
      "0";


    sunBloom.style.opacity =
      "0";


    sunRays.forEach(

      ray => {

        ray.style.opacity =
          "0";

      }

    );


    return;

  }


  const width =

    viewer
      .scene
      .canvas
      .clientWidth;


  const height =

    viewer
      .scene
      .canvas
      .clientHeight;


  const sunX =

    clamp(

      screen.x,

      -120,

      width + 120

    );


  const sunY =

    clamp(

      screen.y,

      -120,

      height + 120

    );


  const angle =

    Cesium.Math.toDegrees(

      Math.atan2(

        height / 2
        -
        sunY,

        width / 2
        -
        sunX

      )

    );


  realSun.style.left =
    sunX + "px";


  realSun.style.top =
    sunY + "px";


  realSun.style.opacity =

    String(

      contribution
      *
      .95

    );


  sunBloom.style.left =
    sunX + "px";


  sunBloom.style.top =
    sunY + "px";


  sunBloom.style.opacity =

    String(

      contribution
      *
      .62

    );


  sunRays.forEach(

    (
      ray,
      index
    ) => {


      const offset =

        Number(

          ray.dataset.offset
          ||
          0

        );


      ray.style.left =
        sunX + "px";


      ray.style.top =

        (
          sunY

          +

          (
            index
            -
            1.5
          )

          *
          14
        )

        +

        "px";


      ray.style.transform =

        `rotate(${angle + offset}deg)`;


      ray.style.opacity =

        String(

          contribution

          *

          (
            index % 2 === 0
            ?
            .38
            :
            .23
          )

        );

    }

  );

}



/* =========================================================
   SOFT NIGHT VISIBILITY

   Only raises dark globe pixels.
   Space remains black.
========================================================= */


try {


  const softNight =

    new Cesium.PostProcessStage({

      name:
        "notron-night-lift",


      fragmentShader:
      `

        uniform sampler2D colorTexture;

        uniform sampler2D depthTexture;

        in vec2 v_textureCoordinates;


        uniform float nightVisibility;


        void main()
        {

          vec4 originalColor =

            texture(
              colorTexture,
              v_textureCoordinates
            );


          float depth =

            czm_unpackDepth(

              texture(
                depthTexture,
                v_textureCoordinates
              )

            );


          /*
          Do not brighten stars / space.
          */

          if(
            depth >= 0.999999
          )
          {

            out_FragColor =
              originalColor;

            return;

          }


          float luminance =

            dot(

              originalColor.rgb,

              vec3(
                0.2126,
                0.7152,
                0.0722
              )

            );


          /*
          Stronger lift only for
          already-dark terrain.
          */

          float darkMask =

            1.0

            -

            smoothstep(

              0.12,

              0.42,

              luminance

            );


          vec3 lifted =

            pow(

              max(
                originalColor.rgb,
                vec3(0.0)
              ),

              vec3(0.78)

            );


          lifted +=

            vec3(
              0.025,
              0.030,
              0.040
            );


          float amount =

            darkMask

            *

            nightVisibility

            *

            0.42;


          vec3 finalColor =

            mix(

              originalColor.rgb,

              lifted,

              amount

            );


          out_FragColor =

            vec4(

              finalColor,

              originalColor.a

            );

        }

      `,


      uniforms: {

        nightVisibility:
          NIGHT_VISIBILITY

      }

    });


  viewer
    .scene
    .postProcessStages
    .add(
      softNight
    );


}

catch(error) {

  console.warn(
    "Night lift unavailable.",
    error
  );

}



/* =========================================================
   POST RENDER LOOP
========================================================= */


viewer
.scene
.postRender
.addEventListener(

  ()=> {


    updateCloudPositions();


    updateSunVisuals();

  }

);



/* =========================================================
   SEARCH ACTION
========================================================= */


document
.getElementById(
  "search"
)
.addEventListener(

  "submit",

  event => {


    event.preventDefault();


    const country =

      findCountry(

        document
          .getElementById(
            "countryInput"
          )
          .value

      );


    if(
      country
    ) {


      focusCountry(

        country,

        true

      );


      document
        .getElementById(
          "countryInput"
        )
        .blur();

    }

  }

);



/* =========================================================
   INITIALIZE
========================================================= */


async function initialize() {


  try {


    await loadSatelliteImagery();



    const response =

      await fetch(

        "https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson"

      );


    if(
      !response.ok
    ) {

      throw new Error(
        "Country data could not load."
      );

    }


    const data =

      await response.json();


    countries =
      data.features;



    /*
    Thin WHITE borders.
    */

    drawWorldBorders();



    /*
    Start with Türkiye.
    */

    const turkey =

      countries.find(

        country =>

          normalize(

            countryName(
              country
            )

          )

          ===

          "turkey"

      );


    if(
      !turkey
    ) {

      throw new Error(
        "Türkiye was not found."
      );

    }


    focusCountry(

      turkey,

      false

    );

  }


  catch(error) {

    showError(
      error
    );

  }

}



initialize();


</script>
