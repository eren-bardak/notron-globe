<!-- =========================================================
     NOTRON — REAL SUN POSITION + DYNAMIC SUN RAYS
     
     Paste this whole block immediately before </body>
     
     Uses:
     - real current date/time
     - astronomical Sun position
     - real Cesium globe illumination
     - real day/night direction
     - sun-position-based ray direction
     - camera angle
     - camera zoom
     
     SUN_VARIANCE_WEIGHT controls how strongly sunlight
     contributes to the visual experience.
========================================================= -->

<script>

(function installRealSunSystem() {

  /* =======================================================
     REMOVE OLD FAKE SUN ELEMENTS
  ======================================================= */

  const oldSun =
    document.getElementById("sunGlow");

  if (oldSun) {
    oldSun.remove();
  }

  document
    .querySelectorAll(".sunRay")
    .forEach(el => el.remove());


  /* =======================================================
     CONFIGURATION

     Think of this as a "variance contributor".

     0.0 = Sun has almost no visual contribution
     1.0 = normal
     1.5 = stronger / more cinematic
  ======================================================= */

  const SUN_VARIANCE = {

    enabled: true,

    weight: 1.0,

    /* Rays begin appearing when far enough from Earth */
    raysStartHeight: 1600000,

    /* Rays reach full strength around this height */
    raysFullHeight: 6500000,

    /* Maximum opacity */
    maxRayOpacity: 0.50,

    /* Size of visual sun */
    sunSize: 115,

    /* How far out we project astronomical Sun direction */
    sunProxyDistance: 55000000

  };


  /* =======================================================
     REAL-TIME CLOCK

     Sun position changes naturally with actual time.
  ======================================================= */

  viewer.clock.currentTime =
    Cesium.JulianDate.fromDate(
      new Date()
    );

  viewer.clock.shouldAnimate =
    true;

  viewer.clock.multiplier =
    1;


  /* =======================================================
     REAL PHYSICAL SUN LIGHTING
  ======================================================= */

  viewer.scene.sun.show =
    true;

  viewer.scene.skyBox.show =
    true;

  viewer.scene.skyAtmosphere.show =
    true;


  /*
     IMPORTANT

     Your previous code had:

     viewer.scene.globe.enableLighting = false;

     We override it here.
  */

  viewer.scene.globe.enableLighting =
    true;


  /*
     Make atmosphere respond to Sun direction.
  */

  viewer.scene.globe.dynamicAtmosphereLighting =
    true;

  viewer.scene.globe.dynamicAtmosphereLightingFromSun =
    true;


  viewer.scene.globe.showGroundAtmosphere =
    true;


  /*
     Use Cesium's actual Sun light.
  */

  viewer.scene.light =
    new Cesium.SunLight();


  /* =======================================================
     PRELOAD EARTH <-> SPACE TRANSFORMS

     Needed to convert astronomical Sun coordinates
     into coordinates that rotate with Earth.
  ======================================================= */

  const preloadNow =
    Cesium.JulianDate.clone(
      viewer.clock.currentTime
    );


  const preloadStart =
    Cesium.JulianDate.addDays(

      preloadNow,

      -2,

      new Cesium.JulianDate()

    );


  const preloadStop =
    Cesium.JulianDate.addDays(

      preloadNow,

      2,

      new Cesium.JulianDate()

    );


  Cesium.Transforms.preloadIcrfFixed(

    new Cesium.TimeInterval({

      start:
        preloadStart,

      stop:
        preloadStop

    })

  );


  /* =======================================================
     CREATE CSS
  ======================================================= */

  const style =
    document.createElement(
      "style"
    );


  style.textContent = `

    /* ===============================================
       REAL SUN VISUAL LAYER
    =============================================== */

    #realSunLayer {

      position: fixed;

      inset: 0;

      overflow: hidden;

      pointer-events: none;

      z-index: 25;

    }


    /* ===============================================
       SUN DISC / GLOW
    =============================================== */

    #realSunGlow {

      position: absolute;

      width: ${SUN_VARIANCE.sunSize}px;
      height: ${SUN_VARIANCE.sunSize}px;

      margin-left: -${SUN_VARIANCE.sunSize / 2}px;
      margin-top: -${SUN_VARIANCE.sunSize / 2}px;

      border-radius: 50%;

      pointer-events: none;

      opacity: 0;

      will-change:
        left,
        top,
        opacity;


      background:

        radial-gradient(

          circle,

          rgba(255,255,250,1) 0%,

          rgba(255,245,200,.98) 8%,

          rgba(255,218,128,.92) 17%,

          rgba(255,184,66,.52) 29%,

          rgba(255,155,36,.20) 45%,

          transparent 70%

        );


      box-shadow:

        0 0 35px
        rgba(255,245,200,.95),

        0 0 80px
        rgba(255,210,110,.70),

        0 0 160px
        rgba(255,170,55,.35),

        0 0 280px
        rgba(255,130,30,.15);


      filter:
        blur(.4px);

      mix-blend-mode:
        screen;

    }



    /* ===============================================
       LIGHT RAYS
    =============================================== */

    .realSunRay {

      position: absolute;

      left: 0;
      top: 0;

      width: max(130vw, 1500px);

      height: 100px;

      transform-origin:
        0 50%;

      pointer-events:
        none;

      opacity:
        0;

      will-change:
        transform,
        left,
        top,
        opacity;


      background:

        linear-gradient(

          90deg,

          rgba(255,246,205,.38) 0%,

          rgba(255,226,150,.24) 10%,

          rgba(255,199,105,.14) 30%,

          rgba(255,178,80,.06) 52%,

          transparent 76%

        );


      filter:
        blur(24px);


      mix-blend-mode:
        screen;

    }



    .realSunRay.soft {

      height:
        180px;

      filter:
        blur(45px);

    }



    /* ===============================================
       VERY SUBTLE LENS BLOOM
    =============================================== */

    #realSunBloom {

      position:
        absolute;

      width:
        420px;

      height:
        420px;

      margin-left:
        -210px;

      margin-top:
        -210px;

      border-radius:
        50%;

      opacity:
        0;

      pointer-events:
        none;

      will-change:
        left,
        top,
        opacity;


      background:

        radial-gradient(

          circle,

          rgba(255,230,170,.11),

          rgba(255,190,95,.055) 30%,

          transparent 68%

        );


      filter:
        blur(18px);


      mix-blend-mode:
        screen;

    }

  `;


  document.head.appendChild(
    style
  );


  /* =======================================================
     CREATE HTML ELEMENTS
  ======================================================= */

  const layer =
    document.createElement(
      "div"
    );


  layer.id =
    "realSunLayer";


  layer.innerHTML = `

    <div id="realSunBloom"></div>

    <div
      class="realSunRay"
      data-offset="-4"
    ></div>

    <div
      class="realSunRay soft"
      data-offset="-1.5"
    ></div>

    <div
      class="realSunRay"
      data-offset="2"
    ></div>

    <div
      class="realSunRay soft"
      data-offset="5"
    ></div>

    <div id="realSunGlow"></div>

  `;


  document.body.appendChild(
    layer
  );


  const sunGlow =
    document.getElementById(
      "realSunGlow"
    );


  const sunBloom =
    document.getElementById(
      "realSunBloom"
    );


  const sunRays =

    Array.from(

      document.querySelectorAll(
        ".realSunRay"
      )

    );


  /* =======================================================
     SCRATCH OBJECTS

     Reusing these prevents creating garbage
     every animation frame.
  ======================================================= */

  const scratchSunInertial =
    new Cesium.Cartesian3();


  const scratchSunFixed =
    new Cesium.Cartesian3();


  const scratchSunDirection =
    new Cesium.Cartesian3();


  const scratchSunProxy =
    new Cesium.Cartesian3();


  const scratchCameraDirection =
    new Cesium.Cartesian3();


  const scratchCameraRadial =
    new Cesium.Cartesian3();


  const scratchToSun =
    new Cesium.Cartesian3();


  const scratchMatrix =
    new Cesium.Matrix3();


  const scratchScreen =
    new Cesium.Cartesian2();



  /* =======================================================
     HELPERS
  ======================================================= */

  function clamp(
    value,
    min,
    max
  ) {

    return Math.max(

      min,

      Math.min(
        max,
        value
      )

    );

  }



  function smoothstep(
    min,
    max,
    value
  ) {

    const x =
      clamp(

        (value - min)
        /
        (max - min),

        0,

        1

      );


    return x * x * (3 - 2 * x);

  }



  /* =======================================================
     GET REAL SUN DIRECTION

     1. Calculate Sun in inertial space
     2. Transform it into Earth-fixed space
     3. Normalize it

     This means Earth rotation + date + time
     all affect the result.
  ======================================================= */

  function getSunDirectionFixed(
    time
  ) {


    Cesium
      .Simon1994PlanetaryPositions
      .computeSunPositionInEarthInertialFrame(

        time,

        scratchSunInertial

      );


    const transform =

      Cesium
        .Transforms
        .computeIcrfToFixedMatrix(

          time,

          scratchMatrix

        );


    /*
       Transform data may not be ready
       during the first frames.
    */

    if(
      !Cesium.defined(
        transform
      )
    ) {

      return null;

    }


    Cesium
      .Matrix3
      .multiplyByVector(

        transform,

        scratchSunInertial,

        scratchSunFixed

      );


    Cesium
      .Cartesian3
      .normalize(

        scratchSunFixed,

        scratchSunDirection

      );


    return scratchSunDirection;

  }



  /* =======================================================
     UPDATE SUN

     These are the actual variance contributors:

     1. Sun astronomical position
     2. Earth rotation
     3. Current time
     4. Camera rotation
     5. Camera distance
     6. Whether Sun is on camera-facing hemisphere
  ======================================================= */

  function updateRealSun() {


    if(
      !SUN_VARIANCE.enabled
    ) {

      layer.style.display =
        "none";

      return;

    }


    layer.style.display =
      "block";


    const time =
      viewer.clock.currentTime;


    const sunDirection =

      getSunDirectionFixed(
        time
      );


    if(
      !sunDirection
    ) {

      return;

    }



    /* =====================================================
       SUN PROXY POSITION

       The real Sun is ~150 million km away.

       We only need the DIRECTION for screen projection,
       so we create a closer proxy point in the same
       astronomical direction.
    ===================================================== */

    Cesium
      .Cartesian3
      .multiplyByScalar(

        sunDirection,

        SUN_VARIANCE.sunProxyDistance,

        scratchSunProxy

      );



    /* =====================================================
       CAMERA HEIGHT CONTRIBUTION

       Close to country:
       no giant cinematic rays.

       Far from Earth:
       rays become visible.
    ===================================================== */

    const cameraHeight =

      viewer
        .camera
        .positionCartographic
        .height;


    const zoomContribution =

      smoothstep(

        SUN_VARIANCE.raysStartHeight,

        SUN_VARIANCE.raysFullHeight,

        cameraHeight

      );



    /* =====================================================
       CAMERA-SIDE / HEMISPHERE CONTRIBUTION

       Determines whether the Sun is on the
       hemisphere currently facing the viewer.
    ===================================================== */

    Cesium
      .Cartesian3
      .normalize(

        viewer.camera.positionWC,

        scratchCameraRadial

      );


    const hemisphereDot =

      Cesium
        .Cartesian3
        .dot(

          scratchCameraRadial,

          sunDirection

        );


    /*
       -1 = opposite side of Earth
        0 = horizon
        1 = directly on viewer side
    */

    const hemisphereContribution =

      smoothstep(

        -0.12,

        0.35,

        hemisphereDot

      );



    /* =====================================================
       CAMERA DIRECTION CONTRIBUTION

       Rays are stronger when the camera is oriented
       toward the direction of the Sun.
    ===================================================== */

    Cesium
      .Cartesian3
      .subtract(

        scratchSunProxy,

        viewer.camera.positionWC,

        scratchToSun

      );


    Cesium
      .Cartesian3
      .normalize(

        scratchToSun,

        scratchToSun

      );


    Cesium
      .Cartesian3
      .normalize(

        viewer.camera.directionWC,

        scratchCameraDirection

      );


    const cameraDot =

      Cesium
        .Cartesian3
        .dot(

          scratchCameraDirection,

          scratchToSun

        );


    const facingContribution =

      smoothstep(

        -0.10,

        0.65,

        cameraDot

      );



    /* =====================================================
       FINAL SUN VARIANCE CONTRIBUTION

       This is the value you can think of as:

       sunlight_visual_variance

       0 = no contribution
       1 = maximum contribution
    ===================================================== */

    let sunContribution =

      zoomContribution

      *

      hemisphereContribution

      *

      facingContribution

      *

      SUN_VARIANCE.weight;


    sunContribution =

      clamp(

        sunContribution,

        0,

        1.5

      );



    /* =====================================================
       PROJECT SUN INTO SCREEN
    ===================================================== */

    const screenPosition =

      Cesium
        .SceneTransforms
        .worldToWindowCoordinates(

          viewer.scene,

          scratchSunProxy,

          scratchScreen

        );


    if(
      !screenPosition
    ) {


      sunGlow.style.opacity =
        "0";


      sunBloom.style.opacity =
        "0";


      sunRays.forEach(

        ray => {

          ray.style.opacity =
            "0";

        }

      );


      return;

    }



    const width =
      viewer.scene.canvas.clientWidth;


    const height =
      viewer.scene.canvas.clientHeight;



    /*
       Sun may mathematically be outside the screen.

       Clamp it slightly outside the viewport so rays
       can still enter naturally from the edge.
    */

    const sunX =

      clamp(

        screenPosition.x,

        -120,

        width + 120

      );


    const sunY =

      clamp(

        screenPosition.y,

        -120,

        height + 120

      );



    /* =====================================================
       SCREEN CENTER

       Rays point FROM the astronomical Sun
       TOWARD the globe / screen.
    ===================================================== */

    const centerX =
      width / 2;


    const centerY =
      height / 2;


    const angle =

      Math.atan2(

        centerY - sunY,

        centerX - sunX

      );


    const angleDegrees =

      angle

      *

      180

      /

      Math.PI;



    /* =====================================================
       SUN GLOW
    ===================================================== */

    sunGlow.style.left =
      sunX + "px";


    sunGlow.style.top =
      sunY + "px";


    sunGlow.style.opacity =

      clamp(

        sunContribution * 0.95,

        0,

        1

      );



    /* =====================================================
       BLOOM
    ===================================================== */

    sunBloom.style.left =
      sunX + "px";


    sunBloom.style.top =
      sunY + "px";


    sunBloom.style.opacity =

      clamp(

        sunContribution * 0.72,

        0,

        0.72

      );



    /* =====================================================
       RAYS

       Their angle now changes continuously based on
       the REAL Sun position.
    ===================================================== */

    sunRays.forEach(

      (
        ray,
        index
      ) => {


        const offset =

          Number(
            ray.dataset.offset || 0
          );


        /*
           Slightly different vertical starts
           make the rays look organic.
        */

        const verticalOffset =

          (
            index
            -
            (sunRays.length - 1) / 2
          )

          *

          15;


        ray.style.left =
          sunX + "px";


        ray.style.top =

          (
            sunY
            +
            verticalOffset
          )

          +
          "px";


        ray.style.transform =

          `rotate(${angleDegrees + offset}deg)`;


        const individualStrength =

          index % 2 === 0

          ?

          1

          :

          0.62;


        ray.style.opacity =

          clamp(

            sunContribution

            *

            SUN_VARIANCE.maxRayOpacity

            *

            individualStrength,

            0,

            SUN_VARIANCE.maxRayOpacity

          );

      }

    );

  }



  /* =======================================================
     UPDATE EVERY FRAME
  ======================================================= */

  viewer
    .scene
    .postRender
    .addEventListener(

      updateRealSun

    );



  /* =======================================================
     INITIAL UPDATE
  ======================================================= */

  updateRealSun();



  /* =======================================================
     OPTIONAL DEBUG

     You can inspect the real Cesium time with:

     console.log(
       Cesium.JulianDate.toDate(
         viewer.clock.currentTime
       )
     );
  ======================================================= */

})();

</script>
