<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Notron Commune</title>


<!-- CESIUM -->
<script
  src="https://cdn.jsdelivr.net/npm/cesium@1.121/Build/Cesium/Cesium.js">
</script>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/cesium@1.121/Build/Cesium/Widgets/widgets.css"
>


<!-- TURF -->
<script
  src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js">
</script>


<style>

*{
  box-sizing:border-box;
}


html,
body,
#cesiumContainer{

  width:100%;
  height:100%;

  margin:0;
  padding:0;

  overflow:hidden;

  background:#000;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

}


/* Hide unnecessary Cesium buttons */

.cesium-viewer-toolbar{
  display:none!important;
}


/* =========================================
   SEARCH UI
========================================= */


#ui{

  position:fixed;

  top:24px;
  left:50%;

  transform:translateX(-50%);

  width:min(90vw,440px);

  z-index:1000;

}


#search{

  display:flex;

  gap:8px;

  padding:8px;

  border-radius:20px;

  background:
    rgba(5,11,22,.76);

  border:
    1px solid rgba(255,255,255,.13);

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  box-shadow:
    0 15px 40px rgba(0,0,0,.35);

}


#countryInput{

  flex:1;

  min-width:0;

  border:none;

  outline:none;

  padding:
    13px 15px;

  border-radius:14px;

  background:
    rgba(255,255,255,.08);

  color:white;

  font-size:15px;

}


#countryInput::placeholder{

  color:
    rgba(255,255,255,.5);

}


#focusButton{

  border:none;

  border-radius:14px;

  padding:
    0 18px;

  background:white;

  color:#09111d;

  font-weight:700;

  cursor:pointer;

}


/* =========================================
   COUNTRY STATUS
========================================= */


#status{

  width:max-content;

  max-width:90%;

  margin:
    9px auto 0;

  padding:
    7px 13px;

  border-radius:999px;

  background:
    rgba(5,11,22,.65);

  border:
    1px solid rgba(255,255,255,.10);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

  color:
    rgba(255,255,255,.65);

  font-size:11px;

}


#status strong{

  color:white;

}


/* =========================================
   CLOUD LAYER
========================================= */


#cloudLayer{

  position:fixed;

  inset:0;

  z-index:500;

  pointer-events:none;

  overflow:hidden;

}


/* =========================================
   CLOUD
========================================= */


.cloud{

  position:absolute;

  min-width:72px;

  max-width:115px;

  padding:
    9px 13px;

  color:#152437;

  font-size:10px;

  font-weight:700;

  text-align:center;

  border-radius:999px;

  opacity:0;


  background:

    radial-gradient(
      circle at 25% 28%,
      rgba(255,255,255,1) 0 28%,
      transparent 30%
    ),

    radial-gradient(
      circle at 52% 18%,
      rgba(255,255,255,1) 0 35%,
      transparent 37%
    ),

    radial-gradient(
      circle at 78% 32%,
      rgba(248,252,255,.98) 0 28%,
      transparent 30%
    ),

    linear-gradient(
      180deg,
      rgba(255,255,255,.98),
      rgba(222,240,255,.95)
    );


  box-shadow:

    0 9px 22px
    rgba(0,0,0,.20),

    0 0 20px
    rgba(170,220,255,.30);


  transform:
    translate(-50%,-50%)
    scale(.15);


  animation:

    cloudLife
    8s
    ease-in-out
    forwards,

    cloudFloat
    4.5s
    ease-in-out
    infinite
    alternate;

}


/* extra fluffy cloud pieces */


.cloud::before{

  content:"";

  position:absolute;

  width:32px;
  height:32px;

  left:16px;
  top:-13px;

  border-radius:50%;

  background:white;

  z-index:-1;

}


.cloud::after{

  content:"";

  position:absolute;

  width:39px;
  height:39px;

  right:14px;
  top:-16px;

  border-radius:50%;

  background:#f8fcff;

  z-index:-1;

}


/* =========================================
   CLOUD POP / DISAPPEAR
========================================= */


@keyframes cloudLife{


  0%{

    opacity:0;

    transform:
      translate(-50%,-50%)
      translateY(12px)
      scale(.15);

    filter:
      blur(3px);

  }


  15%{

    opacity:1;

    transform:
      translate(-50%,-50%)
      translateY(0)
      scale(1);

    filter:
      blur(0);

  }


  65%{

    opacity:1;

    transform:
      translate(-50%,-50%)
      translateY(-4px)
      scale(1);

  }


  82%{

    opacity:.75;

  }


  100%{

    opacity:0;

    transform:
      translate(-50%,-50%)
      translateY(-18px)
      scale(.82);

    filter:
      blur(2px);

  }

}



/* subtle movement */


@keyframes cloudFloat{


  from{

    margin-left:-5px;

    margin-top:2px;

  }


  to{

    margin-left:7px;

    margin-top:-5px;

  }

}



</style>

</head>



<body>


<div id="cesiumContainer"></div>


<div id="ui">

<form id="search">


<input
  id="countryInput"
  placeholder="Search country..."
  autocomplete="off"
>


<button
  id="focusButton"
  type="submit">

Focus

</button>


</form>



<div id="status">

<strong id="countryLabel">
Türkiye
</strong>

· Commune · Anonymous reactions

</div>


</div>



<div id="cloudLayer"></div>



<script>


/* ==========================================================
   CREATE CESIUM VIEWER
========================================================== */


const viewer =
  new Cesium.Viewer(

    "cesiumContainer",

    {

      animation:false,

      timeline:false,

      baseLayerPicker:false,

      geocoder:false,

      homeButton:false,

      sceneModePicker:false,

      navigationHelpButton:false,

      fullscreenButton:false,

      infoBox:false,

      selectionIndicator:false,

      shouldAnimate:true,

      baseLayer:false,

      terrainProvider:
        new Cesium.EllipsoidTerrainProvider()

    }

  );



/* ==========================================================
   HIGH QUALITY RENDERING
========================================================== */


viewer.resolutionScale =

  Math.min(

    window.devicePixelRatio || 1,

    2

  );



/*
Lower number =
more detailed tiles requested.
*/

viewer.scene.globe.maximumScreenSpaceError =
  1;



/*
Keep more tiles in memory
while zooming.
*/

viewer.scene.globe.tileCacheSize =
  1000;



viewer.scene.globe.preloadAncestors =
  true;


viewer.scene.globe.preloadSiblings =
  true;



/*
Anti aliasing
*/

viewer.scene.fxaa =
  true;



/*
Atmosphere
*/

viewer.scene.skyAtmosphere.show =
  true;


viewer.scene.globe.showGroundAtmosphere =
  true;



/*
Keep satellite imagery bright.
*/

viewer.scene.globe.enableLighting =
  false;



/*
Allow close zoom.
*/

viewer
.scene
.screenSpaceCameraController
.minimumZoomDistance =
  1000;


viewer
.scene
.screenSpaceCameraController
.maximumZoomDistance =
  50000000;



/* ==========================================================
   GLOBAL VARIABLES
========================================================== */


let countries = [];


let selectedCountry = null;


let selectedBorderSource = null;


let cloudObjects = [];


let cloudTimer = null;



/* ==========================================================
   COMMENTS
========================================================== */


const comments = [

  "Mantıklı",

  "Katılıyorum",

  "Bence iyi",

  "Emin değilim",

  "Olabilir",

  "Neden?",

  "Kararsızım",

  "Destekliyorum",

  "Riskli olabilir",

  "Daha adil olur",

  "İyi düşünülmeli",

  "Bence hayır"

];



/* ==========================================================
   NORMALIZE COUNTRY NAME
========================================================== */


function normalize(text){


  return String(text || "")

    .toLowerCase()

    .replaceAll(
      "ı",
      "i"
    )

    .normalize(
      "NFD"
    )

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .replace(
      /[^a-z0-9]/g,
      ""
    );

}



/* ==========================================================
   FIND COUNTRY
========================================================== */


function findCountry(search){


  let q =
    normalize(
      search
    );


  if(
    q === "turkiye"
  ){

    q =
      "turkey";

  }


  if(
    q === "usa"
    ||
    q === "us"
  ){

    q =
      "unitedstatesofamerica";

  }


  if(
    q === "uk"
  ){

    q =
      "unitedkingdom";

  }



  return countries.find(

    country =>

      normalize(
        country.properties?.name
      )

      ===

      q

  )


  ||


  countries.find(

    country =>

      normalize(
        country.properties?.name
      )
      .includes(q)

  );

}



/* ==========================================================
   LOAD HIGH RES SATELLITE IMAGERY
========================================================== */


async function loadSatelliteImagery(){


  const provider =

    await Cesium
      .ArcGisMapServerImageryProvider
      .fromUrl(

        "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"

      );


  viewer
    .imageryLayers
    .addImageryProvider(
      provider
    );

}



/* ==========================================================
   COUNTRY BORDERS
========================================================== */


async function drawWorldBorders(){


  const collection = {

    type:
      "FeatureCollection",

    features:
      countries

  };


  const source =

    await Cesium
      .GeoJsonDataSource
      .load(

        collection,

        {

          stroke:

            Cesium
            .Color
            .WHITE
            .withAlpha(.42),

          fill:

            Cesium
            .Color
            .TRANSPARENT,

          strokeWidth:
            1,

          clampToGround:
            true

        }

      );


  viewer
    .dataSources
    .add(
      source
    );

}



/* ==========================================================
   HIGHLIGHT SELECTED COUNTRY
========================================================== */


async function highlightCountry(country){


  if(
    selectedBorderSource
  ){


    viewer
      .dataSources
      .remove(

        selectedBorderSource,

        true

      );


    selectedBorderSource =
      null;

  }



  selectedBorderSource =

    await Cesium
      .GeoJsonDataSource
      .load(

        country,

        {

          stroke:

            Cesium
            .Color
            .fromCssColorString(
              "#ffd66b"
            )
            .withAlpha(.95),

          fill:

            Cesium
            .Color
            .fromCssColorString(
              "#ffd66b"
            )
            .withAlpha(.05),

          strokeWidth:
            2,

          clampToGround:
            true

        }

      );


  viewer
    .dataSources
    .add(
      selectedBorderSource
    );

}



/* ==========================================================
   COUNTRY CAMERA RECTANGLE
========================================================== */


function countryRectangle(country){


  const bbox =
    turf.bbox(
      country
    );


  return Cesium
    .Rectangle
    .fromDegrees(

      bbox[0],

      bbox[1],

      bbox[2],

      bbox[3]

    );

}



/* ==========================================================
   FOCUS COUNTRY
========================================================== */


async function focusCountry(

  country,

  animate = true

){


  if(
    !country
  ){

    return;

  }


  selectedCountry =
    country;



  const originalName =

    country
      .properties
      ?.name;



  const displayName =

    normalize(
      originalName
    )

    ===

    "turkey"

    ?

    "Türkiye"

    :

    originalName;



  document
    .getElementById(
      "countryLabel"
    )
    .textContent =
      displayName;



  clearClouds();



  await highlightCountry(
    country
  );



  const rectangle =

    countryRectangle(
      country
    );



  if(
    animate
  ){


    viewer
      .camera
      .flyTo(

        {

          destination:
            rectangle,

          duration:
            1.6

        }

      );

  }


  else{


    viewer
      .camera
      .setView(

        {

          destination:
            rectangle

        }

      );

  }



  /*
  Give camera time to settle,
  then start reactions.
  */


  setTimeout(

    startCloudFlow,

    animate
      ? 1200
      : 300

  );

}



/* ==========================================================
   RANDOM POINT INSIDE COUNTRY
========================================================== */


function randomPointInsideCountry(){


  if(
    !selectedCountry
  ){

    return null;

  }



  const bbox =

    turf.bbox(
      selectedCountry
    );



  for(

    let attempt = 0;

    attempt < 1500;

    attempt++

  ){


    const lng =

      bbox[0]

      +

      Math.random()

      *

      (
        bbox[2]
        -
        bbox[0]
      );



    const lat =

      bbox[1]

      +

      Math.random()

      *

      (
        bbox[3]
        -
        bbox[1]
      );



    const point =

      turf.point(

        [
          lng,
          lat
        ]

      );



    if(

      turf.booleanPointInPolygon(

        point,

        selectedCountry

      )

    ){


      return {

        lat,
        lng

      };

    }

  }



  return null;

}



/* ==========================================================
   SPAWN CLOUD
========================================================== */


function spawnCloud(){


  if(
    !selectedCountry
  ){

    return;

  }



  const location =
    randomPointInsideCountry();



  if(
    !location
  ){

    return;

  }



  const element =

    document
      .createElement(
        "div"
      );


  element.className =
    "cloud";



  element.textContent =

    comments[

      Math.floor(

        Math.random()

        *

        comments.length

      )

    ];



  document
    .getElementById(
      "cloudLayer"
    )
    .appendChild(
      element
    );



  const position =

    Cesium
      .Cartesian3
      .fromDegrees(

        location.lng,

        location.lat,

        7000

      );



  const cloud = {

    id:
      crypto.randomUUID
      ?
      crypto.randomUUID()
      :
      String(
        Date.now()
        +
        Math.random()
      ),

    element,

    position,

    lat:
      location.lat,

    lng:
      location.lng

  };



  cloudObjects.push(
    cloud
  );



  /*
  Maximum 3 clouds at once.
  */


  if(
    cloudObjects.length > 3
  ){


    const oldest =
      cloudObjects.shift();


    oldest
      .element
      .remove();

  }



  /*
  Remove after animation.
  */


  setTimeout(

    ()=>{


      cloudObjects =

        cloudObjects.filter(

          item =>
            item !== cloud

        );


      element.remove();

    },

    8000

  );

}



/* ==========================================================
   POSITION CLOUDS ON 3D EARTH

   IMPORTANT:
   This is the corrected Cesium API.
========================================================== */


viewer
.scene
.postRender
.addEventListener(

  ()=>{


    cloudObjects.forEach(

      cloud =>{


        const screenPosition =

          Cesium
            .SceneTransforms
            .worldToWindowCoordinates(

              viewer.scene,

              cloud.position

            );



        if(
          !screenPosition
        ){


          cloud
            .element
            .style
            .display =
              "none";


          return;

        }



        cloud
          .element
          .style
          .display =
            "block";



        cloud
          .element
          .style
          .left =
            screenPosition.x
            +
            "px";



        cloud
          .element
          .style
          .top =
            screenPosition.y
            +
            "px";

      }

    );

  }

);



/* ==========================================================
   CLOUD FLOW
========================================================== */


function scheduleNextCloud(){


  const delay =

    1800

    +

    Math.random()
    *
    3200;



  cloudTimer =

    setTimeout(

      ()=>{


        spawnCloud();


        scheduleNextCloud();

      },

      delay

    );

}



function startCloudFlow(){


  clearTimeout(
    cloudTimer
  );


  spawnCloud();


  cloudTimer =

    setTimeout(

      ()=>{

        spawnCloud();

        scheduleNextCloud();

      },

      2200

    );

}



/* ==========================================================
   CLEAR CLOUDS
========================================================== */


function clearClouds(){


  clearTimeout(
    cloudTimer
  );



  cloudObjects.forEach(

    cloud =>{

      cloud
        .element
        .remove();

    }

  );


  cloudObjects = [];

}



/* ==========================================================
   SEARCH
========================================================== */


document
  .getElementById(
    "search"
  )
  .addEventListener(

    "submit",

    event =>{


      event.preventDefault();



      const value =

        document
          .getElementById(
            "countryInput"
          )
          .value;



      const country =

        findCountry(
          value
        );



      if(
        country
      ){


        focusCountry(
          country,
          true
        );


        document
          .getElementById(
            "countryInput"
          )
          .blur();

      }

    }

  );



/* ==========================================================
   INITIALIZE APP
========================================================== */


async function initialize(){


  try{


    /*
    Load satellite tiles.
    */


    await loadSatelliteImagery();



    /*
    Load countries.
    */


    const response =

      await fetch(

        "https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson"

      );



    const data =
      await response.json();



    countries =
      data.features;



    /*
    Draw world borders.
    */


    await drawWorldBorders();



    /*
    Start on Türkiye.
    */


    const turkey =

      countries.find(

        country =>

          normalize(
            country.properties?.name
          )

          ===

          "turkey"

      );



    await focusCountry(

      turkey,

      false

    );


  }


  catch(error){


    console.error(
      error
    );


    document
      .getElementById(
        "status"
      )
      .innerHTML =

      "<strong>Loading error</strong> · check console";

  }

}



/* START */

initialize();


</script>


</body>

</html>
