<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
/>

<title>Notron Commune</title>

<!-- CESIUM -->
<script src="https://cdn.jsdelivr.net/npm/cesium@1.121/Build/Cesium/Cesium.js"></script>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/cesium@1.121/Build/Cesium/Widgets/widgets.css"
/>

<!-- TURF -->
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>


<style>

* {
  box-sizing: border-box;
}

html,
body,
#cesiumContainer {

  width: 100%;
  height: 100%;

  margin: 0;
  padding: 0;

  overflow: hidden;

  background: #000;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}


/* =========================================
   CESIUM
========================================= */

.cesium-viewer-toolbar {
  display: none !important;
}


/* =========================================
   SEARCH
========================================= */

#ui {

  position: fixed;

  top: 24px;
  left: 50%;

  transform: translateX(-50%);

  width: min(90vw, 440px);

  z-index: 1000;

}


#search {

  display: flex;

  gap: 8px;

  padding: 8px;

  border-radius: 20px;

  background:
    rgba(5, 11, 22, .76);

  border:
    1px solid rgba(255,255,255,.13);

  backdrop-filter: blur(18px);

  -webkit-backdrop-filter: blur(18px);

  box-shadow:
    0 15px 40px rgba(0,0,0,.35);

}


#countryInput {

  flex: 1;

  min-width: 0;

  border: none;
  outline: none;

  padding: 13px 15px;

  border-radius: 14px;

  background:
    rgba(255,255,255,.08);

  color: white;

  font-size: 15px;

}


#countryInput::placeholder {

  color:
    rgba(255,255,255,.5);

}


#focusButton {

  border: none;

  border-radius: 14px;

  padding: 0 18px;

  background: white;

  color: #09111d;

  font-weight: 700;

  cursor: pointer;

}


/* =========================================
   STATUS
========================================= */

#status {

  width: max-content;

  max-width: 90%;

  margin: 9px auto 0;

  padding: 7px 13px;

  border-radius: 999px;

  background:
    rgba(5,11,22,.65);

  border:
    1px solid rgba(255,255,255,.10);

  backdrop-filter: blur(12px);

  color:
    rgba(255,255,255,.65);

  font-size: 11px;

}


#status strong {

  color: white;

}


/* =========================================
   CLOUD LAYER
========================================= */

#cloudLayer {

  position: fixed;

  inset: 0;

  pointer-events: none;

  z-index: 500;

  overflow: hidden;

}


/* =========================================
   CLOUD
========================================= */

.cloud {

  position: absolute;

  min-width: 70px;
  max-width: 105px;

  padding: 8px 11px;

  color: #142336;

  font-size: 9px;

  font-weight: 700;

  text-align: center;

  border-radius: 999px;

  opacity: 0;


  background:

    radial-gradient(
      circle at 27% 27%,
      white 0 28%,
      transparent 30%
    ),

    radial-gradient(
      circle at 53% 17%,
      white 0 34%,
      transparent 36%
    ),

    radial-gradient(
      circle at 77% 31%,
      #f9fcff 0 27%,
      transparent 29%
    ),

    linear-gradient(
      180deg,
      #fff,
      #e3f2ff
    );


  box-shadow:

    0 8px 20px
    rgba(0,0,0,.18),

    0 0 18px
    rgba(175,220,255,.28);


  transform:
    translate(-50%,-50%)
    scale(.15);


  animation:

    cloudLife
    8s
    ease-in-out
    forwards,

    cloudFloat
    5s
    ease-in-out
    infinite
    alternate;

}


.cloud::before {

  content: "";

  position: absolute;

  width: 30px;
  height: 30px;

  left: 13px;
  top: -12px;

  border-radius: 50%;

  background: white;

  z-index: -1;

}


.cloud::after {

  content: "";

  position: absolute;

  width: 36px;
  height: 36px;

  right: 13px;
  top: -15px;

  border-radius: 50%;

  background: #f9fcff;

  z-index: -1;

}


@keyframes cloudLife {

  0% {

    opacity: 0;

    transform:
      translate(-50%,-50%)
      translateY(10px)
      scale(.15);

    filter: blur(3px);

  }

  15% {

    opacity: 1;

    transform:
      translate(-50%,-50%)
      scale(1);

    filter: blur(0);

  }

  65% {

    opacity: 1;

    transform:
      translate(-50%,-50%)
      translateY(-4px)
      scale(1);

  }

  100% {

    opacity: 0;

    transform:
      translate(-50%,-50%)
      translateY(-18px)
      scale(.82);

    filter: blur(2px);

  }

}


@keyframes cloudFloat {

  from {

    margin-left: -5px;
    margin-top: 3px;

  }

  to {

    margin-left: 7px;
    margin-top: -5px;

  }

}


/* =========================================
   SUN
========================================= */

#sunGlow {

  position: fixed;

  z-index: 20;

  width: 220px;
  height: 220px;

  left: -90px;
  top: -80px;

  border-radius: 50%;

  pointer-events: none;

  opacity: 0;

  transition:
    opacity 1.2s ease;


  background:

    radial-gradient(
      circle,

      rgba(255,255,240,1) 0%,

      rgba(255,224,140,.95) 13%,

      rgba(255,184,80,.55) 28%,

      rgba(255,140,30,.18) 48%,

      transparent 70%
    );


  filter: blur(2px);


  box-shadow:

    0 0 90px
    rgba(255,205,100,.55),

    0 0 200px
    rgba(255,150,40,.25);

}


/* =========================================
   SUN RAYS
========================================= */

.sunRay {

  position: fixed;

  z-index: 19;

  left: -70px;

  width: 900px;
  height: 90px;

  pointer-events: none;

  opacity: 0;

  transform-origin: left center;

  transition:
    opacity 1.2s ease;

  filter: blur(18px);

  mix-blend-mode: screen;


  background:

    linear-gradient(
      90deg,

      rgba(255,235,170,.22),

      rgba(255,205,120,.10),

      transparent
    );

}


#ray1 {
  top: 20px;
  transform: rotate(17deg);
}


#ray2 {
  top: 80px;
  transform: rotate(27deg);
}


#ray3 {
  top: 145px;
  transform: rotate(37deg);
}


#ray4 {
  top: 205px;
  transform: rotate(47deg);
}


.spaceVisible {

  opacity: 1 !important;

}


/* =========================================
   VIGNETTE
========================================= */

#vignette {

  position: fixed;

  inset: 0;

  pointer-events: none;

  z-index: 30;

  box-shadow:

    inset 0 0 100px
    rgba(0,0,0,.22);

}

</style>

</head>


<body>


<div id="cesiumContainer"></div>


<!-- SUN -->

<div id="sunGlow"></div>

<div id="ray1" class="sunRay"></div>

<div id="ray2" class="sunRay"></div>

<div id="ray3" class="sunRay"></div>

<div id="ray4" class="sunRay"></div>

<div id="vignette"></div>


<!-- UI -->

<div id="ui">

<form id="search">

<input
  id="countryInput"
  placeholder="Search country..."
  autocomplete="off"
/>

<button
  id="focusButton"
  type="submit"
>
Focus
</button>

</form>


<div id="status">

<strong id="countryLabel">
Türkiye
</strong>

· Commune · Anonymous reactions

</div>

</div>


<div id="cloudLayer"></div>


<script>


/* =========================================================
   CESIUM VIEWER
========================================================= */


const viewer =

  new Cesium.Viewer(

    "cesiumContainer",

    {

      animation: false,

      timeline: false,

      baseLayerPicker: false,

      geocoder: false,

      homeButton: false,

      sceneModePicker: false,

      navigationHelpButton: false,

      fullscreenButton: false,

      infoBox: false,

      selectionIndicator: false,

      shouldAnimate: true,

      baseLayer: false,

      terrainProvider:
        new Cesium.EllipsoidTerrainProvider()

    }

  );



/* =========================================================
   QUALITY
========================================================= */


viewer.resolutionScale =

  Math.min(

    window.devicePixelRatio || 1,

    2

  );


viewer.scene.globe.maximumScreenSpaceError =
  1;


viewer.scene.globe.tileCacheSize =
  1000;


viewer.scene.globe.preloadAncestors =
  true;


viewer.scene.globe.preloadSiblings =
  true;


viewer.scene.fxaa =
  true;


/* =========================================================
   SPACE
========================================================= */


viewer.scene.skyBox.show =
  true;


viewer.scene.skyAtmosphere.show =
  true;


viewer.scene.sun.show =
  true;


viewer.scene.moon.show =
  true;


viewer.scene.globe.showGroundAtmosphere =
  true;


viewer.scene.globe.enableLighting =
  false;


/* =========================================================
   ZOOM LIMIT
========================================================= */


/*
120000 = 120 km.

Increase this if you want
to restrict zoom even more.

Example:
200000 = 200 km
*/

viewer
.scene
.screenSpaceCameraController
.minimumZoomDistance =
  120000;


viewer
.scene
.screenSpaceCameraController
.maximumZoomDistance =
  55000000;



/* =========================================================
   VARIABLES
========================================================= */


let countries = [];


let selectedCountry = null;


/*
ALL WORLD BORDERS
*/

let worldBorderBackSource =
  null;


let worldBorderFrontSource =
  null;


/*
SELECTED COUNTRY BORDER
*/

let selectedBorderBackSource =
  null;


let selectedBorderFrontSource =
  null;


let cloudObjects = [];


let cloudTimer = null;



/* =========================================================
   COMMENTS
========================================================= */


const comments = [

  "Mantıklı",

  "Katılıyorum",

  "Bence iyi",

  "Emin değilim",

  "Olabilir",

  "Neden?",

  "Kararsızım",

  "Destekliyorum",

  "Riskli olabilir",

  "Daha adil olur",

  "İyi düşünülmeli",

  "Bence hayır"

];



/* =========================================================
   NORMALIZE
========================================================= */


function normalize(text) {

  return String(text || "")

  .toLowerCase()

  .replaceAll(
    "ı",
    "i"
  )

  .normalize(
    "NFD"
  )

  .replace(
    /[\u0300-\u036f]/g,
    ""
  )

  .replace(
    /[^a-z0-9]/g,
    ""
  );

}



/* =========================================================
   SATELLITE IMAGERY
========================================================= */


async function loadSatelliteImagery() {


  const provider =

    await Cesium
    .ArcGisMapServerImageryProvider
    .fromUrl(

      "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"

    );


  viewer
  .imageryLayers
  .addImageryProvider(
    provider
  );

}



/* =========================================================
   FIND COUNTRY
========================================================= */


function findCountry(search) {


  let q =
    normalize(
      search
    );


  if(
    q === "turkiye"
  ) {

    q =
      "turkey";

  }


  if(
    q === "usa"
    ||
    q === "us"
  ) {

    q =
      "unitedstatesofamerica";

  }


  if(
    q === "uk"
  ) {

    q =
      "unitedkingdom";

  }



  return countries.find(

    country =>

      normalize(
        country.properties?.name
      )

      === q

  )


  ||


  countries.find(

    country =>

      normalize(
        country.properties?.name
      )

      .includes(q)

  );

}



/* =========================================================
   WORLD COUNTRY BORDERS

   DOUBLE LAYER:

   BLACK THICK BORDER
   +
   WHITE THINNER BORDER
========================================================= */


async function drawWorldBorders() {


  const collection = {

    type:
      "FeatureCollection",

    features:
      countries

  };


  /*
  DARK BORDER UNDERNEATH
  */


  worldBorderBackSource =

    await Cesium
    .GeoJsonDataSource
    .load(

      collection,

      {

        stroke:

          Cesium
          .Color
          .BLACK
          .withAlpha(.88),

        fill:

          Cesium
          .Color
          .TRANSPARENT,

        strokeWidth:
          5,

        clampToGround:
          true

      }

    );


  viewer
  .dataSources
  .add(
    worldBorderBackSource
  );



  /*
  BRIGHT WHITE BORDER
  */


  worldBorderFrontSource =

    await Cesium
    .GeoJsonDataSource
    .load(

      collection,

      {

        stroke:

          Cesium
          .Color
          .WHITE
          .withAlpha(.92),

        fill:

          Cesium
          .Color
          .TRANSPARENT,

        strokeWidth:
          2,

        clampToGround:
          true

      }

    );


  viewer
  .dataSources
  .add(
    worldBorderFrontSource
  );

}



/* =========================================================
   SELECTED COUNTRY

   VERY STRONG BORDER:

   BLACK HALO
   +
   GOLD BORDER
========================================================= */


async function highlightCountry(country) {


  /*
  REMOVE OLD SELECTED COUNTRY
  */


  if(
    selectedBorderBackSource
  ) {


    viewer
    .dataSources
    .remove(

      selectedBorderBackSource,

      true

    );


    selectedBorderBackSource =
      null;

  }


  if(
    selectedBorderFrontSource
  ) {


    viewer
    .dataSources
    .remove(

      selectedBorderFrontSource,

      true

    );


    selectedBorderFrontSource =
      null;

  }



  /*
  THICK BLACK HALO
  */


  selectedBorderBackSource =

    await Cesium
    .GeoJsonDataSource
    .load(

      country,

      {

        stroke:

          Cesium
          .Color
          .BLACK
          .withAlpha(.97),

        fill:

          Cesium
          .Color
          .fromCssColorString(
            "#FFD54A"
          )
          .withAlpha(.08),

        strokeWidth:
          10,

        clampToGround:
          true

      }

    );


  viewer
  .dataSources
  .add(
    selectedBorderBackSource
  );



  /*
  BRIGHT GOLD BORDER
  */


  selectedBorderFrontSource =

    await Cesium
    .GeoJsonDataSource
    .load(

      country,

      {

        stroke:

          Cesium
          .Color
          .fromCssColorString(
            "#FFD54A"
          )
          .withAlpha(1),

        fill:

          Cesium
          .Color
          .TRANSPARENT,

        strokeWidth:
          4,

        clampToGround:
          true

      }

    );


  viewer
  .dataSources
  .add(
    selectedBorderFrontSource
  );

}



/* =========================================================
   COUNTRY RECTANGLE
========================================================= */


function countryRectangle(country) {


  const bbox =
    turf.bbox(
      country
    );


  return Cesium
  .Rectangle
  .fromDegrees(

    bbox[0],

    bbox[1],

    bbox[2],

    bbox[3]

  );

}



/* =========================================================
   FOCUS COUNTRY
========================================================= */


async function focusCountry(

  country,

  animate = true

) {


  if(
    !country
  ) {

    return;

  }


  selectedCountry =
    country;


  const name =
    country.properties?.name;


  document
  .getElementById(
    "countryLabel"
  )
  .textContent =

    normalize(name)
    ===
    "turkey"

    ?

    "Türkiye"

    :

    name;



  clearClouds();


  await highlightCountry(
    country
  );


  const rectangle =

    countryRectangle(
      country
    );


  if(
    animate
  ) {


    viewer
    .camera
    .flyTo(

      {

        destination:
          rectangle,

        duration:
          1.7

      }

    );

  }


  else {


    viewer
    .camera
    .setView(

      {

        destination:
          rectangle

      }

    );

  }



  setTimeout(

    startCloudFlow,

    animate
    ?
    1300
    :
    350

  );

}



/* =========================================================
   SAFE COUNTRY AREA

   We shrink the country.

   This prevents clouds
   appearing directly
   on borders.
========================================================= */


function getSafeCountryArea() {


  if(
    !selectedCountry
  ) {

    return null;

  }


  /*
  Try progressively
  smaller inward buffers.

  Large countries use
  the larger safety margin.

  Small countries fall back.
  */


  const distances = [

    -45,

    -30,

    -20,

    -10,

    -5

  ];



  for(
    const distance
    of distances
  ) {


    try {


      const safe =

        turf.buffer(

          selectedCountry,

          distance,

          {

            units:
              "kilometers"

          }

        );


      if(
        safe
      ) {

        return safe;

      }


    }

    catch(error) {}

  }


  return selectedCountry;

}



/* =========================================================
   RANDOM POINT INSIDE SAFE COUNTRY
========================================================= */


function randomPointInsideCountry() {


  const safeCountry =
    getSafeCountryArea();


  if(
    !safeCountry
  ) {

    return null;

  }


  const bbox =

    turf.bbox(
      safeCountry
    );


  for(

    let attempt = 0;

    attempt < 2000;

    attempt++

  ) {


    const lng =

      bbox[0]

      +

      Math.random()

      *

      (
        bbox[2]
        -
        bbox[0]
      );


    const lat =

      bbox[1]

      +

      Math.random()

      *

      (
        bbox[3]
        -
        bbox[1]
      );


    const point =

      turf.point(

        [
          lng,
          lat
        ]

      );


    try {


      if(

        turf.booleanPointInPolygon(

          point,

          safeCountry

        )

      ) {


        return {

          lat,
          lng

        };

      }


    }

    catch(error) {}

  }


  return null;

}



/* =========================================================
   SPAWN CLOUD
========================================================= */


function spawnCloud() {


  if(
    !selectedCountry
  ) {

    return;

  }


  const location =
    randomPointInsideCountry();


  if(
    !location
  ) {

    return;

  }


  const element =

    document
    .createElement(
      "div"
    );


  element.className =
    "cloud";


  element.textContent =

    comments[

      Math.floor(

        Math.random()

        *

        comments.length

      )

    ];


  document
  .getElementById(
    "cloudLayer"
  )
  .appendChild(
    element
  );


  const position =

    Cesium
    .Cartesian3
    .fromDegrees(

      location.lng,

      location.lat,

      6000

    );


  const cloud = {

    id:
      Date.now()
      +
      Math.random(),

    element,

    position

  };


  cloudObjects.push(
    cloud
  );


  /*
  MAXIMUM 3 CLOUDS
  */


  if(
    cloudObjects.length > 3
  ) {


    const oldest =
      cloudObjects.shift();


    oldest
    .element
    .remove();

  }


  /*
  REMOVE CLOUD
  */


  setTimeout(

    ()=> {


      cloudObjects =

        cloudObjects.filter(

          item =>
            item !== cloud

        );


      element.remove();

    },

    8000

  );

}



/* =========================================================
   PROJECT CLOUD TO SCREEN
========================================================= */


viewer
.scene
.postRender
.addEventListener(

  ()=> {


    cloudObjects.forEach(

      cloud => {


        const screenPosition =

          Cesium
          .SceneTransforms
          .worldToWindowCoordinates(

            viewer.scene,

            cloud.position

          );


        if(
          !screenPosition
        ) {


          cloud
          .element
          .style
          .display =
            "none";


          return;

        }


        cloud
        .element
        .style
        .display =
          "block";


        cloud
        .element
        .style
        .left =
          screenPosition.x
          +
          "px";


        cloud
        .element
        .style
        .top =
          screenPosition.y
          +
          "px";

      }

    );

  }

);



/* =========================================================
   NATURAL CLOUD FLOW
========================================================= */


function scheduleNextCloud() {


  const delay =

    2200

    +

    Math.random()
    *
    3000;


  cloudTimer =

    setTimeout(

      ()=> {


        spawnCloud();


        scheduleNextCloud();

      },

      delay

    );

}



function startCloudFlow() {


  clearTimeout(
    cloudTimer
  );


  spawnCloud();


  cloudTimer =

    setTimeout(

      ()=> {


        spawnCloud();


        scheduleNextCloud();

      },

      2200

    );

}



/* =========================================================
   CLEAR CLOUDS
========================================================= */


function clearClouds() {


  clearTimeout(
    cloudTimer
  );


  cloudObjects.forEach(

    cloud => {


      cloud
      .element
      .remove();

    }

  );


  cloudObjects = [];

}



/* =========================================================
   SPACE EFFECTS

   When camera moves far away,
   show sunlight overlay.

   Cesium itself displays
   stars / atmosphere.
========================================================= */


const sunGlow =

  document
  .getElementById(
    "sunGlow"
  );


const rays =

  document
  .querySelectorAll(
    ".sunRay"
  );


function updateSpaceEffects() {


  const height =

    viewer
    .camera
    .positionCartographic
    .height;


  /*
  Above ~2500 km.
  */


  if(
    height > 2500000
  ) {


    sunGlow
    .classList
    .add(
      "spaceVisible"
    );


    rays.forEach(

      ray =>

        ray
        .classList
        .add(
          "spaceVisible"
        )

    );

  }


  else {


    sunGlow
    .classList
    .remove(
      "spaceVisible"
    );


    rays.forEach(

      ray =>

        ray
        .classList
        .remove(
          "spaceVisible"
        )

    );

  }

}


viewer
.camera
.changed
.addEventListener(

  updateSpaceEffects

);



/* =========================================================
   SEARCH
========================================================= */


document
.getElementById(
  "search"
)
.addEventListener(

  "submit",

  event => {


    event.preventDefault();


    const value =

      document
      .getElementById(
        "countryInput"
      )
      .value;


    const country =

      findCountry(
        value
      );


    if(
      country
    ) {


      focusCountry(
        country,
        true
      );


      document
      .getElementById(
        "countryInput"
      )
      .blur();

    }

  }

);



/* =========================================================
   INITIALIZE
========================================================= */


async function initialize() {


  try {


    /*
    HD SATELLITE TILES
    */


    await loadSatelliteImagery();


    /*
    COUNTRY DATA
    */


    const response =

      await fetch(

        "https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson"

      );


    const data =
      await response.json();


    countries =
      data.features;


    /*
    VERY CLEAR WORLD BORDERS
    */


    await drawWorldBorders();


    /*
    START WITH TÜRKİYE
    */


    const turkey =

      countries.find(

        country =>

          normalize(
            country.properties?.name
          )

          ===

          "turkey"

      );


    await focusCountry(

      turkey,

      false

    );


    updateSpaceEffects();

  }


  catch(error) {


    console.error(
      error
    );


    document
    .getElementById(
      "status"
    )
    .innerHTML =

      "<strong>Loading error</strong>";

  }

}


initialize();


</script>

</body>
